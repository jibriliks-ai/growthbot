<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Auto Traffic Engine</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface-2:#1a1a24;--surface-3:#23232e;--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#71717a;--accent:#8b5cf6;--accent-2:#6366f1;--accent-l:#c4b5fd;--accent-grad:linear-gradient(135deg,#8b5cf6,#6366f1);--accent-glow:rgba(139,92,246,0.25);--success:#10b981;--success-bg:rgba(16,185,129,0.12);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.12);--error:#ef4444;--error-bg:rgba(239,68,68,0.12);--info:#3b82f6;--info-bg:rgba(59,130,246,0.12);--r-sm:8px;--r-md:12px;--r-lg:16px;--shadow-md:0 4px 12px rgba(0,0,0,0.35);--shadow-lg:0 12px 32px rgba(0,0,0,0.45);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent-l);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30;overflow-y:auto}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);z-index:1}
.sidebar-logo{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 16px var(--accent-glow);overflow:hidden}
.sidebar-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.sidebar-title{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.sidebar-subtitle{font-size:10px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-group{margin-bottom:20px}
.nav-group-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;padding:0 10px 8px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13px;font-weight:500;transition:all .15s ease;cursor:pointer;width:100%;text-align:left;margin-bottom:2px;position:relative}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:rgba(139,92,246,0.12);color:var(--accent-l);font-weight:600}
.nav-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-link-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-link-lock{margin-left:auto;font-size:10px;opacity:0.7}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);text-align:center;flex-shrink:0}
.sidebar-plan{padding:10px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:var(--r-sm);margin-bottom:10px}
.sidebar-plan.premium{background:var(--accent-grad);border-color:transparent;color:#fff}
.sidebar-plan-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:0.85}
.sidebar-plan-name{font-size:13px;font-weight:700;margin-top:2px}
.main-wrap{flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0}
.mobile-header{background:rgba(19,19,26,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.hamburger{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .15s}
.mobile-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mobile-brand-mark{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 3px 12px var(--accent-glow);overflow:hidden}
.mobile-brand-mark img{width:100%;height:100%;object-fit:cover}
.mobile-brand-text{min-width:0;flex:1}
.mobile-brand-title{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.mobile-brand-sub{font-size:10px;color:var(--text-2);margin-top:1px;font-weight:500}
.plan-pill{padding:4px 9px;border-radius:999px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
.plan-pill.premium{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 0 12px var(--accent-glow)}
.header-logout-btn{width:36px;height:36px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;cursor:pointer;transition:all .15s}
.header-logout-btn:hover{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.4)}
@media(max-width:400px){.mobile-brand-title{font-size:0}.mobile-brand-title::after{content:"ATE";font-size:16px}.sidebar-title{font-size:0}.sidebar-title::after{content:"Auto Traffic Engine";font-size:12px}}
.content{flex:1;max-width:900px;width:100%;margin:0 auto;padding:20px 16px 100px;min-width:0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,26,0.92);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--border);display:flex;z-index:25;padding-bottom:var(--safe-bot)}
.bnav-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;font-size:9px;font-weight:600;color:var(--text-3);transition:color .2s;min-height:56px;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav-item .bn-icon{font-size:20px;line-height:1;transition:transform .2s}
.bnav-item.active{color:var(--accent-l)}
.bnav-item.active .bn-icon{transform:translateY(-1px)}
.bnav-item.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent-grad);border-radius:0 0 2px 2px;box-shadow:0 0 8px var(--accent-glow)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:60;opacity:0;visibility:hidden;transition:opacity .2s}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,85vw);background:var(--surface);border-right:1px solid var(--border);z-index:61;transform:translateX(-100%);transition:transform .28s cubic-bezier(0.32,0.72,0,1);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:calc(16px + var(--safe-top)) 16px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.drawer-close{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;margin-left:auto}
.drawer-nav{padding:16px 12px;flex:1}
.card{background:rgba(19,19,26,0.5);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:var(--border-h)}
.card-tight{padding:14px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;line-height:1.15;background:linear-gradient(135deg,var(--text) 40%,var(--accent-l));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.5}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin:20px 0 10px}
.section-title:first-child{margin-top:0}
.label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.label:first-child{margin-top:0}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.textarea{resize:vertical;min-height:70px;font-family:inherit}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.select option,.select optgroup{background:var(--surface);color:var(--text)}
.btn{width:100%;padding:12px 16px;border-radius:var(--r-md);background:var(--accent-grad);color:#fff;font-weight:600;font-size:14px;transition:transform .1s,box-shadow .15s,opacity .15s;margin-top:12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){box-shadow:0 0 24px var(--accent-glow)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover:not(:disabled){background:var(--surface-3);border-color:var(--border-h);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn.small{width:auto;padding:8px 14px;font-size:12px;min-height:34px;margin-top:8px;border-radius:var(--r-sm)}
.btn.danger{background:rgba(239,68,68,0.9);color:#fff}
.status{padding:12px 14px;border-radius:var(--r-sm);font-size:13px;margin-top:12px;line-height:1.5}
.status.info{background:var(--info-bg);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.status.success{background:var(--success-bg);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
.status.error{background:var(--error-bg);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.status.warning{background:var(--warning-bg);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent-l),#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;letter-spacing:-.02em}
.stat-label{font-size:10px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 8px 14px;text-align:center;transition:all .2s}
.quick:hover:not(:disabled){border-color:var(--border-h);transform:translateY(-2px)}
.quick:disabled{opacity:.4;cursor:not-allowed}
.quick-icon{font-size:28px;display:block;margin-bottom:6px;line-height:1}
.quick-label{font-size:12px;font-weight:600}
.quick-sub{font-size:10px;color:var(--text-3);margin-top:2px}
.score-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:24px 0;margin-bottom:16px;background:rgba(10,10,15,0.6);border-radius:var(--r-md);border:1px solid var(--border)}
.score-block{text-align:center}
.score-num{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent-l),#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.03em}
.score-num.good{background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.score-label{font-size:11px;color:var(--text-3);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.score-arrow{color:var(--accent-l);font-size:24px;opacity:.7}
.list{list-style:none;display:flex;flex-direction:column;gap:6px}
.list-item{padding:10px 12px;border-radius:var(--r-sm);font-size:12px;background:rgba(10,10,15,0.6);border-left:3px solid var(--border-h);color:var(--text-2);line-height:1.5}
.list-item.error{border-left-color:var(--error);color:#fca5a5}
.list-item.warning{border-left-color:var(--warning);color:#fcd34d}
.list-item.success{border-left-color:var(--success);color:#6ee7b7}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:10px 12px;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(139,92,246,0.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge.new{background:var(--accent-glow);color:var(--accent-l)}
.badge.delivered,.badge.posted,.badge.submitted,.badge.success{background:var(--success-bg);color:#6ee7b7}
.badge.pending,.badge.sent,.badge.clicked{background:var(--info-bg);color:#93c5fd}
.badge.failed,.badge.rejected{background:var(--error-bg);color:#fca5a5}
.badge.source{background:var(--surface-2);color:var(--text-2);text-transform:none}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-line{height:14px;margin-bottom:8px}
.skeleton-card{padding:16px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--r-md)}
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:.6;display:inline-block}
.empty-title{font-size:16px;font-weight:700;margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--text-2);line-height:1.6;max-width:340px;margin:0 auto 16px}
.subtabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:var(--r-md);border:1px solid var(--border)}
.subtab{flex:1;padding:9px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--text-2);transition:all .15s}
.subtab:hover:not(.active){color:var(--text);background:var(--surface-2)}
.subtab.active{background:var(--accent-grad);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.q-card{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px;transition:border-color .15s}
.q-card:hover{border-color:var(--border-h)}
.q-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.q-badge{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;margin-top:2px}
.q-badge.reddit{background:rgba(255,69,0,.15);color:#ff6b3d}
.q-badge.quora{background:rgba(185,43,39,.15);color:#e74c3c}
.q-badge.nairaland{background:var(--success-bg);color:#4ade80}
.q-badge.lemmy{background:rgba(14,165,233,.15);color:#38bdf8}
.q-badge.default{background:var(--accent-glow);color:var(--accent-l)}
.q-title{font-size:13px;font-weight:600;line-height:1.4;flex:1}
.q-snippet{font-size:12px;color:var(--text-2);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-actions{display:flex;gap:6px;flex-wrap:wrap}
.draft-preview{background:rgba(10,10,15,.7);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.menu-list{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--text);width:100%;text-align:left;font-size:14px;border-bottom:1px solid var(--border);transition:background .15s;min-height:52px}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:var(--surface-2)}
.menu-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.menu-text{flex:1;font-weight:500}
.menu-arrow{color:var(--text-3);font-size:16px;transition:transform .15s}
.biz-switcher{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:11px;color:var(--text);cursor:pointer;max-width:120px;flex-shrink:0}
.toasts{position:fixed;bottom:calc(80px + var(--safe-bot));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{padding:11px 18px;border-radius:var(--r-md);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:toast-in .3s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(20px);pointer-events:auto}
.toast.success{background:rgba(16,185,129,.95);color:#fff}
.toast.error{background:rgba(239,68,68,.95);color:#fff}
.toast.info{background:rgba(59,130,246,.95);color:#fff}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.idle-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.idle-overlay.show{display:flex}
.idle-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.idle-icon{font-size:48px;margin-bottom:16px;display:inline-block}
.idle-title{font-size:18px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.idle-desc{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px}
.idle-countdown{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--warning),#ef4444);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:16px 0;letter-spacing:-.02em}
.idle-btns{display:flex;gap:8px;flex-direction:column}
.idle-btns .btn{margin-top:0}
/* ===== PWA BANNER — FIXED, NEVER OVERLAPS SIDEBAR ===== */
#pwaBanner{
  position:fixed;
  bottom:calc(74px + var(--safe-bot));
  left:50%;
  transform:translateX(-50%);
  z-index:90;
  width:calc(100vw - 32px);
  max-width:480px;
  display:none;
  background:var(--accent-grad);
  color:#fff;
  padding:14px 18px;
  border-radius:var(--r-md);
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 8px 28px rgba(139,92,246,0.4);
  animation:pwaSlideUp .35s cubic-bezier(.16,1,.3,1);
}
#pwaBanner.show{display:flex}
#pwaBanner .text{font-size:13px;font-weight:600;flex:1;line-height:1.4}
#pwaBanner button{background:#fff;color:var(--accent);padding:8px 18px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap;flex-shrink:0;cursor:pointer}
@keyframes pwaSlideUp{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:1024px){#pwaBanner{left:calc(50% + 130px);bottom:24px}}
.listing-item{background:rgba(19,19,26,0.5);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.listing-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.listing-platform{font-weight:700;font-size:14px;color:var(--text)}
.listing-actions{display:flex;gap:6px;flex-wrap:wrap}
.listing-field{margin-top:8px}
.listing-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:3px}
.listing-field-value{font-size:12.5px;color:var(--text-2);line-height:1.5;background:rgba(10,10,15,0.5);padding:8px 10px;border-radius:6px;border:1px solid var(--border)}
@media(min-width:1024px){.sidebar{display:flex}.main-wrap{margin-left:260px}.mobile-header{display:none}.bottom-nav{display:none}.content{padding:32px 32px 40px}.h1{font-size:28px}}
@media(max-width:480px){.stats{gap:8px}.stat{padding:12px 8px}.stat-num{font-size:20px}.quick-icon{font-size:24px}.quick-label{font-size:11px}.quick-sub{font-size:10px}}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="/logo.png" alt="Logo"></div>
      <div>
        <div class="sidebar-title">Auto Traffic Engine</div>
        <div class="sidebar-subtitle">v3.7.0</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer" id="sidebarFooter"></div>
  </aside>

  <div class="main-wrap">
    <header class="mobile-header" id="mobileHeader">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
      <div class="mobile-brand">
        <div class="mobile-brand-mark"><img src="/logo.png" alt="Logo"></div>
        <div class="mobile-brand-text">
          <div class="mobile-brand-title" id="mobileBrandTitle">Auto Traffic Engine</div>
          <div class="mobile-brand-sub" id="mobileBrandSub">Business growth tools</div>
        </div>
      </div>
      <select class="biz-switcher hidden" id="bizSwitcher"></select>
      <span class="plan-pill" id="planPill">…</span>
      <button id="headerLogoutBtn" class="header-logout-btn" aria-label="Sign out" title="Sign out">⏻</button>
    </header>

    <main class="content" id="content">
      <div style="text-align:center;padding:60px 20px;color:var(--text-3);">Loading…</div>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="sidebar-logo"><img src="/logo.png" alt="Logo"></div>
    <div>
      <div class="sidebar-title">Auto Traffic Engine</div>
      <div class="sidebar-subtitle">v3.7.0</div>
    </div>
    <button class="drawer-close" id="drawerClose">×</button>
  </div>
  <nav class="drawer-nav" id="drawerNav"></nav>
  <div class="sidebar-footer" id="drawerFooter"></div>
</aside>

<div id="pwaBanner">
  <div class="text">📱 Install Auto Traffic Engine on your home screen</div>
  <button id="pwaInstallBtn">Install</button>
</div>

<div class="idle-overlay" id="idleOverlay">
  <div class="idle-modal">
    <div class="idle-icon">⏱️</div>
    <div class="idle-title">Session Expiring</div>
    <div class="idle-desc">You've been inactive. You'll be logged out automatically.</div>
    <div class="idle-countdown" id="idleCountdown">60</div>
    <div class="idle-desc" style="margin-bottom:20px;">seconds remaining</div>
    <div class="idle-btns">
      <button class="btn" id="idleStayBtn">Stay signed in</button>
      <button class="btn secondary" id="idleLogoutBtn">Log out now</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function(){
'use strict';

const TOKEN_KEY = 'ate_token';
const AUTH_TOKEN = localStorage.getItem(TOKEN_KEY);
const CURRENT_PATH = location.pathname + location.search;

if (!AUTH_TOKEN) {
  location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH));
  return;
}

// PWA
let deferredPrompt;
const pwaBanner = document.getElementById('pwaBanner');
const pwaInstallBtn = document.getElementById('pwaInstallBtn');
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; if (pwaBanner) pwaBanner.classList.add('show'); });
if (pwaInstallBtn) pwaInstallBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  if (pwaBanner) pwaBanner.classList.remove('show');
});
window.addEventListener('appinstalled', () => { if (pwaBanner) pwaBanner.classList.remove('show'); deferredPrompt = null; });

// Idle
const IDLE_TIMEOUT_MS = 25 * 60 * 1000;
const IDLE_WARN_MS = 60 * 1000;
const ACTIVITY_KEY = 'ate_last_activity';
const CHECK_INTERVAL_MS = 5 * 1000;
let idleCheckInterval = null;
let warnShown = false;
let countdownInterval = null;
let remainingSec = 60;

function touchActivity() { try { localStorage.setItem(ACTIVITY_KEY, String(Date.now())); } catch {} if (warnShown) hideWarn(); }
function getLastActivity() { try { return parseInt(localStorage.getItem(ACTIVITY_KEY) || '0', 10) || Date.now(); } catch { return Date.now(); } }
function handleLogout() { if (confirm('Sign out of Auto Traffic Engine?')) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('ate_user'); location.replace('/login.html'); } }
function forceLogout(reason) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('ate_user'); location.replace('/login.html?expired=1&redirect=' + encodeURIComponent(location.pathname)); }
function showWarn() { if (warnShown) return; warnShown = true; const o = document.getElementById('idleOverlay'); if (!o) return; o.classList.add('show'); remainingSec = 60; updateCountdown(); clearInterval(countdownInterval); countdownInterval = setInterval(() => { remainingSec -= 1; if (remainingSec <= 0) { clearInterval(countdownInterval); return; } updateCountdown(); }, 1000); }
function hideWarn() { warnShown = false; const o = document.getElementById('idleOverlay'); if (o) o.classList.remove('show'); clearInterval(countdownInterval); }
function updateCountdown() { const el = document.getElementById('idleCountdown'); if (el) el.textContent = String(remainingSec); }
function checkIdle() { if (!localStorage.getItem(TOKEN_KEY)) return; const idleMs = Date.now() - getLastActivity(); if (idleMs >= IDLE_TIMEOUT_MS) { forceLogout('idle'); return; } if (idleMs >= IDLE_TIMEOUT_MS - IDLE_WARN_MS) { if (!warnShown) showWarn(); const s = Math.ceil((IDLE_TIMEOUT_MS - idleMs) / 1000); if (s < remainingSec) { remainingSec = s; updateCountdown(); } } }
function startIdleWatcher() { ['mousemove','mousedown','keydown','touchstart','scroll','click','focus'].forEach((ev) => document.addEventListener(ev, touchActivity, { passive: true })); if (!localStorage.getItem(ACTIVITY_KEY)) touchActivity(); idleCheckInterval = setInterval(checkIdle, CHECK_INTERVAL_MS); }
window.addEventListener('storage', (e) => { if (e.key === TOKEN_KEY && !e.newValue) location.replace('/login.html'); if (e.key === ACTIVITY_KEY && warnShown) hideWarn(); });

// Config
const BACKEND = location.origin;
const state = { user: null, apiKey: '', plan: 'free', usage: {}, limits: { freeAudits: 3, premiumVideos: 30, backlinks: 10, businesses: 1, price: 29 }, business: null, businesses: [], analytics: null, countries: [], dirCountries: [], tab: 'home', subTab: 'indexnow', pollTimer: null, isAdmin: false };
const $ = (id) => document.getElementById(id);
const content = $('content');

// Nav
const NAV_GROUPS = [
  { label: 'Main', items: [ { key: 'home', icon: '🏠', label: 'Home' } ]},
  { label: 'Content', items: [ { key: 'seo', icon: '🔍', label: 'SEO Audit' }, { key: 'video', icon: '🎬', label: 'Video Ads', premium: true }, { key: 'keywords', icon: '🔑', label: 'Keywords', premium: true } ]},
  { label: 'Outreach', items: [ { key: 'qa', icon: '💬', label: 'Q&A Finder', premium: true }, { key: 'directories', icon: '📇', label: 'Directories', premium: true }, { key: 'backlinks', icon: '🔗', label: 'Backlinks', premium: true }, { key: 'social', icon: '📱', label: 'Social', premium: true } ]},
  { label: 'Business', items: [ { key: 'campaigns', icon: '📣', label: 'Campaigns' }, { key: 'leads', icon: '👥', label: 'Leads' }, { key: 'reviews', icon: '⭐', label: 'Reviews' }, { key: 'analytics', icon: '📊', label: 'Analytics' } ]},
  { label: 'Account', items: [ { key: 'businesses', icon: '🏢', label: 'Businesses' }, { key: 'settings', icon: '⚙️', label: 'Settings' } ]}
];
const BOTTOM_NAV = [ { key: 'home', icon: '🏠', label: 'Home' }, { key: 'seo', icon: '🔍', label: 'SEO' }, { key: 'video', icon: '🎬', label: 'Video', premium: true }, { key: 'qa', icon: '💬', label: 'Q&A', premium: true }, { key: 'menu', icon: '☰', label: 'Menu', action: 'drawer' } ];

// Utils
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg, type='success'){ const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; $('toasts').appendChild(el); setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translate(-50%,12px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(), 300); }, 2400); }
async function copy(text, label){ try { await navigator.clipboard.writeText(text); toast(label || 'Copied!'); } catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='absolute'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(label || 'Copied!'); } catch { toast('Copy failed','error'); } finally { ta.remove(); } } }
async function api(path, opts){
  const options = Object.assign({method:'GET'}, opts || {});
  if (options.body && typeof options.body !== 'string'){ options.body = JSON.stringify(options.body); options.headers = Object.assign({'Content-Type':'application/json'}, options.headers || {}); }
  options.headers = Object.assign({'Authorization':'Bearer ' + (localStorage.getItem(TOKEN_KEY) || '')}, options.headers || {});
  const res = await fetch(BACKEND + path, options);
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('ate_user'); location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH) + '&expired=1'); throw new Error('Session expired'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok){ const err = new Error(data.error || data.message || 'HTTP ' + res.status); err.status = res.status; err.data = data; throw err; }
  return data;
}

// Nav render
function buildNavHTML(activeKey){
  const isFree = state.plan === 'free';
  const isAdmin = state.isAdmin;
  let html = NAV_GROUPS.map(group => `
    <div class="nav-group">
      <div class="nav-group-label">${esc(group.label)}</div>
      ${group.items.map(item => `
        <button class="nav-link ${activeKey === item.key ? 'active' : ''}" data-tab="${item.key}">
          <span class="nav-link-icon">${item.icon}</span>
          <span>${esc(item.label)}</span>
          ${item.premium && isFree && !isAdmin ? '<span class="nav-link-lock">🔒</span>' : ''}
        </button>
      `).join('')}
    </div>
  `).join('');
  if (isAdmin) html += `<div class="nav-group"><div class="nav-group-label" style="color:#f59e0b;">🛡️ Admin</div><a href="/admin.html" class="nav-link" style="text-decoration:none;color:#fcd34d;"><span class="nav-link-icon">🛡️</span><span>Admin Panel</span><span class="nav-link-lock">↗</span></a></div>`;
  return html;
}

function renderNav(){
  const isFree = state.plan === 'free';
  const isAdmin = state.isAdmin;
  const navHtml = buildNavHTML(state.tab);
  $('sidebarNav').innerHTML = navHtml;
  $('drawerNav').innerHTML = navHtml;
  ['sidebarNav','drawerNav'].forEach(id => { $(id).querySelectorAll('[data-tab]').forEach(btn => { btn.addEventListener('click', ()=>{ const target = btn.getAttribute('data-tab'); closeDrawer(); navigateTo(target); }); }); });
  const footerHTML = `<div class="sidebar-plan ${state.plan === 'premium' ? 'premium' : ''}"><div class="sidebar-plan-label">${state.plan === 'premium' ? '⭐ Premium' : 'Free Plan'}</div><div class="sidebar-plan-name">${state.plan === 'premium' ? 'Active' : 'Upgrade available'}</div></div><button class="btn ghost small" data-logout-btn style="width:100%; color:#ef4444; border-color:rgba(239,68,68,0.3); margin-bottom:8px;">⏻ Sign Out</button><div style="font-size:10px;color:var(--text-3);">Auto Traffic Engine v3.7.0</div>`;
  const sFooter = $('sidebarFooter'); const dFooter = $('drawerFooter');
  if (sFooter) sFooter.innerHTML = footerHTML;
  if (dFooter) dFooter.innerHTML = footerHTML;
  document.querySelectorAll('[data-logout-btn]').forEach(btn => btn.addEventListener('click', handleLogout));
  $('bottomNav').innerHTML = BOTTOM_NAV.map(item => { const isActive = item.action !== 'drawer' && state.tab === item.key; return `<button class="bnav-item ${isActive ? 'active' : ''}" data-bnav="${item.key}"><span class="bn-icon">${item.icon}</span><span>${esc(item.label)}</span>${item.premium && isFree && !isAdmin ? '<span class="bn-lock">🔒</span>' : ''}</button>`; }).join('');
  $('bottomNav').querySelectorAll('[data-bnav]').forEach(btn => { btn.addEventListener('click', ()=>{ const key = btn.getAttribute('data-bnav'); if (key === 'menu') { openDrawer(); return; } navigateTo(key); }); });
}

function navigateTo(target){
  if (target === state.tab) return;
  let tabDef = null;
  NAV_GROUPS.forEach(g => g.items.forEach(i => { if (i.key === target) tabDef = i; }));
  if (tabDef && tabDef.premium && state.plan === 'free' && !state.isAdmin) { renderUpgrade(target); return; }
  stopPolling();
  state.tab = target;
  renderNav();
  renderTab();
  window.scrollTo(0, 0);
}

function openDrawer(){ $('drawer').classList.add('open'); $('drawerOverlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerOverlay').classList.remove('open'); document.body.style.overflow = ''; }

function updateHeader(){
  $('mobileBrandTitle').textContent = state.business?.name || 'Auto Traffic Engine';
  $('mobileBrandSub').textContent = state.business?.category || 'Business growth tools';
  const pill = $('planPill');
  if (state.isAdmin) { pill.textContent = '🛡️ Admin'; pill.classList.add('premium'); }
  else if (state.plan === 'premium') { pill.textContent = '⭐ Premium'; pill.classList.add('premium'); }
  else { pill.textContent = 'Free'; pill.classList.remove('premium'); }
  const sw = $('bizSwitcher');
  if (state.businesses.length <= 1) sw.classList.add('hidden');
  else {
    sw.classList.remove('hidden');
    sw.innerHTML = state.businesses.map(b => `<option value="${b.id}" ${state.business?.id===b.id?'selected':''}>${esc(b.name)}</option>`).join('');
    sw.onchange = e => { const id = Number(e.target.value); const biz = state.businesses.find(b => b.id === id); if (biz) { state.business = biz; updateHeader(); loadAnalytics().then(() => renderTab()); } };
  }
}

async function loadPlan(){ try { const d = await api('/api/check-plan?key=' + encodeURIComponent(state.apiKey) + '&url=' + encodeURIComponent(location.href)); state.plan = d.plan || 'free'; state.usage = d.usage || {}; state.limits = Object.assign(state.limits, d.limits || {}); state.isAdmin = d.isAdmin === true; } catch(e){ console.warn('Plan:', e.message); } }
async function loadBusinesses(){ try { const r = await api('/api/businesses/list'); state.businesses = r.businesses || []; state.business = state.businesses[0] || null; state.limits.businesses = r.limit || state.limits.businesses; } catch { state.businesses = []; state.business = null; } }
async function loadAnalytics(){ if (!state.business) { state.analytics = null; return; } try { const r = await api('/api/businesses/' + state.business.id + '/analytics'); state.analytics = r.analytics; } catch { state.analytics = null; } }
async function loadCountries(){ try { const r = await api('/api/questions/sources'); state.countries = r.countries || []; } catch { state.countries = []; } }
async function loadDirCountries(){ try { const r = await api('/api/directories/countries'); state.dirCountries = r.countries || []; } catch { state.dirCountries = []; } }

function renderTab(){
  content.scrollTop = 0;
  switch(state.tab){
    case 'home': return renderHome();
    case 'seo': return renderSEO();
    case 'video': return renderVideo();
    case 'keywords': return renderKeywords();
    case 'qa': return renderQA();
    case 'directories': return renderDirectories();
    case 'backlinks': return renderBacklinks();
    case 'social': return renderSocial();
    case 'campaigns': return renderCampaigns();
    case 'leads': return renderLeads();
    case 'reviews': return renderReviews();
    case 'analytics': return renderAnalytics();
    case 'businesses': return renderBusinesses();
    case 'settings': return renderSettings();
    default: return renderHome();
  }
}

function renderHome(){
  const isFree = state.plan === 'free';
  const audits = state.usage.auditsToday || 0;
  const videos = state.usage.videosMonth || 0;
  const leads = state.analytics?.leads || 0;
  const questions = state.analytics?.questions_found || 0;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const name = state.user?.name || state.user?.email?.split('@')[0] || '';
  content.innerHTML = `
    <div style="font-size:13px;color:var(--text-2);margin-bottom:4px;font-weight:500;">${greet}${name ? ', ' + esc(name) : ''} 👋${state.isAdmin ? ' <span style="background:rgba(245,158,11,.15);color:#fcd34d;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;margin-left:6px;">🛡️ ADMIN</span>' : ''}</div>
    <h1 class="h1">${esc(state.business?.name || 'Welcome to Auto Traffic Engine')}</h1>
    <p class="subtitle">${state.business ? "Here's what's happening today." : 'Set up your business to unlock every tool.'}</p>
    <div class="section-title">Quick actions</div>
    <div class="quick-grid">
      <button class="quick" data-go="seo"><span class="quick-icon">🔍</span><div class="quick-label">SEO Audit</div><div class="quick-sub">${state.isAdmin ? '∞' : isFree ? (state.limits.freeAudits - audits) + ' left' : 'Unlimited'}</div></button>
      <button class="quick" data-go="video" ${isFree && !state.isAdmin ? 'disabled' : ''}><span class="quick-icon">🎬</span><div class="quick-label">Video Ad</div><div class="quick-sub">${state.isAdmin ? '∞' : isFree ? '🔒 Premium' : videos + '/' + state.limits.premiumVideos}</div></button>
      <button class="quick" data-go="qa" ${isFree && !state.isAdmin ? 'disabled' : ''}><span class="quick-icon">💬</span><div class="quick-label">Find Q&A</div><div class="quick-sub">${state.isAdmin ? '∞' : isFree ? '🔒 Premium' : '60+ countries'}</div></button>
    </div>
    <div class="section-title">This month</div>
    <div class="stats"><div class="stat"><div class="stat-num">${audits}</div><div class="stat-label">Audits</div></div><div class="stat"><div class="stat-num">${videos}</div><div class="stat-label">Videos</div></div><div class="stat"><div class="stat-num">${leads}</div><div class="stat-label">Leads</div></div></div>
    ${questions > 0 ? `<div class="section-title">Q&A activity</div><div class="card card-tight" style="display:flex;justify-content:space-between;align-items:center;gap:12px;"><div><div style="font-size:14px;font-weight:600;">${questions} questions found</div><div style="font-size:11px;color:var(--text-2);margin-top:2px;">${state.analytics?.drafts_posted||0} posted · ${state.analytics?.drafts_pending||0} pending</div></div><button class="btn small secondary" data-go="qa">View →</button></div>` : ''}
    ${state.isAdmin ? `<div class="section-title">Admin</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f59e0b;">🛡️ ADMIN ACCESS</div><div style="font-size:14px;font-weight:600;margin-top:2px;">Monitor users, businesses, leads</div></div><a href="/admin.html" class="btn small" style="text-decoration:none;background:linear-gradient(135deg,#f59e0b,#d97706);">Open Admin Panel →</a></div></div>` : !state.business ? `<div class="section-title">Get started</div><button class="btn" id="openDash">Set up your business →</button>` : `<div class="section-title">Your plan</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);">${isFree?'Free':'Premium'}</div><div style="font-size:14px;font-weight:600;margin-top:2px;">${isFree?'Upgrade for full features':'All features unlocked'}</div></div>${isFree?`<a href="/pay.html?key=${encodeURIComponent(state.apiKey)}" class="btn small" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;">⚡ Upgrade to Premium</a>`:''}</div></div>`}
  `;
  content.querySelectorAll('[data-go]').forEach(btn=>btn.addEventListener('click', ()=>navigateTo(btn.getAttribute('data-go'))));
  const od = $('openDash'); if (od) od.addEventListener('click', ()=>navigateTo('businesses'));
}

function renderSEO(){
  content.innerHTML = `
    <h1 class="h1">SEO Audit</h1>
    <p class="subtitle">Analyze any page for free. Get an instant score with auto-fixes.</p>
    <div class="card">
      <label class="label">Page URL</label>
      <input id="seoUrl" class="input" type="url" value="${esc(location.href)}" />
      <label class="label">Target keyword (optional)</label>
      <input id="seoKw" class="input" placeholder="e.g. buy cows in lagos" />
      <button id="seoGo" class="btn">Audit &amp; Auto-fix</button>
      <div id="seoResult"></div>
    </div>`;
  $('seoGo').addEventListener('click', async function(){
    const btn = this; const url = $('seoUrl').value.trim(); const kw = $('seoKw').value.trim(); const r = $('seoResult');
    if (!url) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Auditing…';
    r.innerHTML = '<div class="status info">Analyzing…</div>';
    try {

function startVideoPolling(pollUrl, container){
  stopPolling();
  const tick = async ()=>{ try { const d = await api(pollUrl); const s = container.querySelector('#vidStatus'); const p = container.querySelector('#vidPreview');
    if (d.status==='done' && d.url){ if (s){ s.className='status success'; s.textContent='✓ Ready'; } if (p) p.innerHTML = `<div style="aspect-ratio:9/16;max-height:400px;margin-top:12px;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border);"><video src="${esc(d.url)}" controls muted playsinline style="width:100%;height:100%;object-fit:contain;"></video></div><a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener" download style="display:block;text-align:center;text-decoration:none;margin-top:12px;">⬇ Download</a>`; return; }
    if (d.status==='failed'){ if (s){ s.className='status error'; s.textContent='Failed'; } return; }
    state.pollTimer = setTimeout(tick, 5000);
  } catch { state.pollTimer = setTimeout(tick, 8000); } };
  tick();
}
function stopPolling(){ if (state.pollTimer){ clearTimeout(state.pollTimer); state.pollTimer=null; } }

async function generateDraft(qid, btn){
  const container = $('draft-' + qid);
  const blogUrl = prompt('Blog post URL:', state.business?.website || location.href); if (!blogUrl) return;
  const blogTitle = prompt('Blog post title:', '') || 'Full guide';
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>…'; container.innerHTML = '<div class="status info">Drafting…</div>';
  try {
    const d = await api('/api/questions/' + qid + '/draft', {method:'POST', body:{blogUrl, blogTitle}});
    const dr = d.draft;
    container.innerHTML = `<div class="draft-preview">${esc(dr.draft_text)}</div><div style="font-size:11px;color:var(--text-3);margin-top:6px;">${esc(dr.platform)} · ${dr.word_count} words · ${esc(dr.status)}</div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;"><button class="btn small secondary" data-copy="${dr.id}">📋 Copy</button><button class="btn small" data-posted="${dr.id}">✓ Mark posted</button></div>`;
    container.querySelector('[data-copy]').addEventListener('click', ()=>copy(dr.draft_text, 'Copied'));
    container.querySelector('[data-posted]').addEventListener('click', async ev=>{ const b = ev.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>'; try { await api('/api/drafts/' + dr.id + '/status', {method:'PUT', body:{status:'posted'}}); toast('Posted'); b.innerHTML = '✓ Posted'; } catch(err){ toast(err.message, 'error'); b.disabled = false; b.textContent = '✓ Mark posted'; } });
  } catch(e){
    // === ADDED LINK_LOCKED HANDLING ===
    if (e.status === 403 && e.data?.error === 'LINK_LOCKED') {
      container.innerHTML = `<div class="status warning">
        🔒 <strong>Link locked.</strong> ${esc(e.data.message)}
        <br><span style="font-size:11px;">Post ${e.data.remaining} more time${e.data.remaining === 1 ? '' : 's'} to unlock links.</span>
      </div>`;
    } else if (e.status === 422) {
      container.innerHTML = `<div class="status warning">Draft rejected.</div>`;
    } else {
      container.innerHTML = `<div class="status error">${esc(e.message)}</div>`;
    }
  }
  finally { btn.disabled = false; btn.innerHTML = '✨ Draft'; }
}

    if (bizs.length === 0){ $('bizList').innerHTML = `<div class="empty"><div class="empty-icon">🏢</div><div class="empty-title">No businesses yet</div></div>`; }
    else {
      let html = '<div class="card"><table class="data-table"><thead><tr><th>Name</th><th>Country</th><th>Status</th><th></th></tr></thead><tbody>';
      bizs.forEach(b=>{ html += `<tr><td><div style="font-weight:600;color:var(--text);">${esc(b.name)} ${b.is_primary?'<span class="badge new" style="margin-left:6px;">Primary</span>':''}</div><div style="font-size:11px;color:var(--text-3);">${esc(b.category||'—')}</div></td><td>${esc((b.country||'ng').toUpperCase())}</td><td>${state.business?.id===b.id?'<span class="badge success">Active</span>':'<span class="badge">Inactive</span>'}</td><td><button class="btn small danger" data-del-biz="${b.id}">Delete</button></td></tr>`; });
      html += '</tbody></table></div>'; $('bizList').innerHTML = html;
      $('bizList').querySelectorAll('[data-del-biz]').forEach(b=>b.addEventListener('click', async ()=>{ if (!confirm('Delete business?')) return; b.disabled = true; b.innerHTML = '<span class="spin"></span>'; try { await api('/api/businesses/' + b.getAttribute('data-del-biz'), {method:'DELETE'}); toast('Deleted'); await loadBusinesses(); updateHeader(); renderBusinesses(); } catch(e){ toast(e.message, 'error'); b.disabled = false; b.textContent = 'Delete'; } }));
    }
  } catch(e){ $('bizList').innerHTML = '<div class="status error">' + esc(e.message) + '</div>'; }
  if (canAdd && $('bizAdd')){
    $('bizAdd').addEventListener('click', async function(){
      const btn = this; const name = $('bizName').value.trim();
      if (!name) { toast('Name required', 'error'); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Creating…';
      try {
        await api('/api/businesses', {method:'POST', body:{ name, category: $('bizCategory').value.trim(), phone: $('bizPhone').value.trim(), whatsapp: $('bizWhatsapp').value.trim(), city: $('bizCity').value.trim(), state: $('bizState').value.trim(), country: $('bizCountry').value, website: $('bizWebsite').value.trim(), googleReviewUrl: $('bizReviewUrl').value.trim(), description: $('bizDesc').value.trim() }});
        toast('Added'); await loadBusinesses(); updateHeader(); renderBusinesses();
      } catch(e){ if (e.status === 403 && e.data?.error === 'BUSINESS_LIMIT') $('bizAddResult').innerHTML = `<div class="status warning">${esc(e.data.message)}</div>`; else $('bizAddResult').innerHTML = '<div class="status error">' + esc(e.message) + '</div>'; btn.disabled = false; btn.textContent = 'Add Business'; }
    });
  }
}

// ===== SETTINGS =====
function renderSettings(){
  const isFree = state.plan === 'free';
  const audits = state.usage.auditsToday || 0;
  const videos = state.usage.videosMonth || 0;
  const lastActivity = getLastActivity();
  const idleMinAgo = Math.floor((Date.now() - lastActivity) / 60000);
  const remaining = Math.max(0, 25 - idleMinAgo);
  content.innerHTML = `
    <h1 class="h1">Settings</h1>
    <p class="subtitle">Account, plan, and API access.</p>
    <div class="section-title">Account</div>
    <div class="card"><div style="font-size:13px;line-height:2;color:var(--text-2);">Email: <strong style="color:var(--text);">${esc(state.user?.email || '—')}</strong><br>Role: <strong style="color:${state.isAdmin ? '#fcd34d' : 'var(--text)'};">${state.isAdmin ? '🛡️ Admin' : esc(state.user?.role || 'user')}</strong><br>Session: <strong style="color:var(--text);">${remaining} min before idle logout</strong></div><button class="btn danger" id="logoutBtn" style="margin-top:12px;">⏻ Log out</button></div>
    ${state.isAdmin ? `<div class="section-title">Admin Access</div><div class="card" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);"><p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:12px;">You have full admin access. All limits bypassed.</p><a href="/admin.html" class="btn" style="text-decoration:none;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;">🛡️ Open Admin Panel</a></div>` : ''}
    <div class="section-title">Your plan</div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${state.isAdmin ? '#f59e0b' : 'var(--text-3)'};">${state.isAdmin ? '🛡️ Admin' : isFree?'Free':'⭐ Premium'}</div><div style="font-size:16px;font-weight:700;margin-top:2px;">${state.isAdmin ? 'Unlimited access' : isFree?'Limited features':'Everything unlocked'}</div></div>${isFree && !state.isAdmin?`<a href="/pay.html?key=${encodeURIComponent(state.apiKey)}" class="btn small" style="text-decoration:none;">⚡ Upgrade</a>`:''}</div></div>
    <div class="section-title">Usage</div>
    <div class="card"><div style="font-size:13px;line-height:2;color:var(--text-2);">Audits today: <strong style="color:var(--text);">${state.isAdmin ? '∞' : audits + '/' + state.limits.freeAudits}</strong><br>Videos this month: <strong style="color:var(--text);">${state.isAdmin ? '∞' : videos + '/' + state.limits.premiumVideos}</strong><br>Businesses: <strong style="color:var(--text);">${state.isAdmin ? state.businesses.length + '/∞' : state.businesses.length + '/' + state.limits.businesses}</strong></div></div>
    <div class="section-title">API Access</div>
    <div class="card"><p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:12px;">Use this key for integrations.</p><div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-l);word-break:break-all;margin-bottom:10px;">${esc(state.apiKey)}</div><button id="copyApiKey" class="btn secondary">Copy API key</button></div>
    <div class="section-title">App Settings</div>
    <div class="card"><p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:12px;">Install Auto Traffic Engine as an app.</p><button class="btn secondary hidden" id="installAppBtnSettings">📱 Install App</button><div style="font-size:11px;color:var(--text-3);margin-top:8px;">If missing, your browser doesn't support PWA install or app is already installed.</div></div>
    <div style="text-align:center;font-size:11px;color:var(--text-3);padding:24px 0;line-height:1.6;">Auto Traffic Engine v3.7.0<br><a href="${BACKEND}/terms.html" target="_blank" rel="noopener" style="color:var(--text-3);">Terms</a></div>`;
  $('copyApiKey').addEventListener('click', ()=>copy(state.apiKey, 'API key copied'));
  $('logoutBtn').addEventListener('click', handleLogout);
  const settingsBtn = $('installAppBtnSettings');
  if (deferredPrompt) { settingsBtn.classList.remove('hidden'); settingsBtn.addEventListener('click', async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; settingsBtn.classList.add('hidden'); if (pwaBanner) pwaBanner.classList.remove('show'); }); }
}

function renderUpgrade(tab){
  const labels = { video:'Video generation', keywords:'Keyword research', qa:'Q&A finder', directories:'Directory listings', backlinks:'Backlink tools', social:'Social posting' };
  content.innerHTML = `<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">${labels[tab] || 'This feature'} is Premium</div><div class="empty-desc">Unlock unlimited audits, AI videos, 60-country Q&A, directories, backlinks, social posting.</div><a href="/pay.html?key=${encodeURIComponent(state.apiKey)}" class="btn" style="display:inline-flex;text-decoration:none;max-width:320px;margin:0 auto;cursor:pointer;">⚡ Upgrade for $29/month</a><button class="btn secondary" id="backHome" style="max-width:320px;margin:8px auto 0;">← Back to home</button></div>`;
  $('backHome').addEventListener('click', ()=>navigateTo('home'));
}

// === EVENTS ===
$('hamburgerBtn').addEventListener('click', openDrawer);
$('drawerClose').addEventListener('click', closeDrawer);
$('drawerOverlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeDrawer(); });
$('idleStayBtn').addEventListener('click', ()=>{ touchActivity(); hideWarn(); toast('Session extended', 'success'); });
$('idleLogoutBtn').addEventListener('click', ()=>{ forceLogout('manual'); });
window.handleLogout = handleLogout;

// === INIT ===
async function init(){
  try {
    const r = await fetch(BACKEND + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN } });
    if (!r.ok) { localStorage.removeItem(TOKEN_KEY); location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH)); return; }
    const data = await r.json();
    state.user = data.user;
    state.apiKey = data.user.api_key;
    state.isAdmin = data.user.role === 'admin';
  } catch (e) { localStorage.removeItem(TOKEN_KEY); location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH)); return; }
  startIdleWatcher();
  touchActivity();
  updateHeader();
  const hLogout = $('headerLogoutBtn'); if (hLogout) hLogout.addEventListener('click', handleLogout);
  await Promise.all([loadPlan(), loadBusinesses(), loadCountries()]);
  await loadAnalytics();

  // === FACEBOOK OAUTH RETURN HANDLER ===
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get('fb_connected')) {
    toast('✅ Facebook Page connected: ' + (urlParams.get('page') || ''), 'success');
    history.replaceState({}, '', '/app.html');
    state.tab = 'social';
  }
  if (urlParams.get('fb_error')) {
    toast('Facebook: ' + urlParams.get('fb_error'), 'error');
    history.replaceState({}, '', '/app.html');
    state.tab = 'social';
  }

  updateHeader(); renderNav(); renderTab();
}

init();
})();
</script>
</body>
</html>
