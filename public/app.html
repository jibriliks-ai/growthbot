<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>GrowthBot — Auto Traffic Engine</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface-2:#1a1a24;--surface-3:#23232e;--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#71717a;--accent:#8b5cf6;--accent-2:#6366f1;--accent-l:#c4b5fd;--accent-grad:linear-gradient(135deg,#8b5cf6,#6366f1);--accent-glow:rgba(139,92,246,0.25);--success:#10b981;--success-bg:rgba(16,185,129,0.12);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.12);--error:#ef4444;--error-bg:rgba(239,68,68,0.12);--info:#3b82f6;--info-bg:rgba(59,130,246,0.12);--r-sm:8px;--r-md:12px;--r-lg:16px;--shadow-md:0 4px 12px rgba(0,0,0,0.35);--shadow-lg:0 12px 32px rgba(0,0,0,0.45);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent-l);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::selection{background:rgba(139,92,246,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(600px 400px at 50% 0,rgba(139,92,246,.12),transparent 70%)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-lg)}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;justify-content:center}
.brand-logo{width:40px;height:40px;border-radius:11px;background:var(--accent-grad);display:grid;place-items:center;box-shadow:0 8px 20px var(--accent-glow)}
.brand-logo svg{width:22px;height:22px;color:#fff}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--text-3);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.login-tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:20px;border:1px solid var(--border)}
.login-tabs button{flex:1;padding:8px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2);transition:.15s}
.login-tabs button.active{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-md)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;overflow-y:auto;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.sidebar.open{transform:translateX(0)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 15px;border-bottom:1px solid var(--border);flex:none}
.nav{padding:10px 10px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);padding:16px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;transition:.15s;width:100%;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(139,92,246,.03));color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item.active svg{opacity:1;color:var(--accent-l)}
.sb-foot{border-top:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-grad);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.sb-foot .who{min-width:0;flex:1}
.sb-foot .who strong{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot .who span{display:block;font-size:11px;color:var(--text-3)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 14px 10px;background:rgba(10,10,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);transition:.15s;flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.topbar-title{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.plan-badge.premium{background:var(--accent-grad);color:#fff;border-color:transparent}

.content{width:100%;max-width:1180px;margin:0 auto;padding:20px 14px calc(40px + var(--safe-bot));flex:1}

.overlay{position:fixed;inset:0;background:rgba(4,4,8,.65);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}

/* ---------- Cards / typography ---------- */
.page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.page-head p{font-size:13px;color:var(--text-2);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:14px;font-weight:600}
.card-head .sub{font-size:12px;color:var(--text-3)}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;border:1px solid transparent;line-height:1.2}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 6px 18px var(--accent-glow)}
.btn-primary:hover:not(:disabled){filter:brightness(1.09)}
.btn-ghost{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.btn-danger{background:var(--error-bg);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.warn{background:var(--warning-bg);color:var(--warning)}
.badge.err{background:var(--error-bg);color:var(--error)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.accent{background:rgba(139,92,246,.18);color:var(--accent-l)}

.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent-grad);transition:width .4s ease}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- Forms ---------- */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:5px;display:block}
.input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;transition:.15s}
.input::placeholder{color:var(--text-3)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.input:disabled{opacity:.55}
select.input{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer}
textarea.input{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.row-2{grid-template-columns:1fr 1fr}.row-3{grid-template-columns:1fr 1fr 1fr}}

/* ---------- Stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 16px}
.stat-label{font-size:12px;color:var(--text-2);font-weight:500}
.stat-value{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11.5px;color:var(--text-3);margin-top:4px}

/* ---------- Score ring ---------- */
.score-ring{position:relative;width:120px;height:120px;flex:none}
.score-ring svg{transform:rotate(-90deg);display:block}
.score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800;letter-spacing:-.03em}
.score-ring .num small{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0;text-transform:uppercase;margin-top:2px}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td .cname{font-weight:600;color:var(--text);font-size:13px}
td .cmeta{font-size:11.5px;color:var(--text-3);margin-top:2px}
td.num{font-variant-numeric:tabular-nums;color:var(--text);text-align:right}

/* ---------- Lists / issues ---------- */
.issue{display:flex;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px}
.issue .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.issue .ic svg{width:14px;height:14px}
.issue.critical .ic{background:var(--error-bg);color:var(--error)}
.issue.warning .ic{background:var(--warning-bg);color:var(--warning)}
.issue.info .ic{background:var(--info-bg);color:var(--info)}
.issue-body{min-width:0;flex:1}
.issue-body .t{font-size:13px;font-weight:600;color:var(--text)}
.issue-body .d{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}
.issue-body .fix{font-size:12px;color:var(--accent-l);margin-top:4px}

.qa-result{display:flex;gap:11px;padding:13px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);margin-bottom:10px}
.qa-result .src{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(139,92,246,.18);color:var(--accent-l);flex:none;align-self:flex-start;margin-top:2px}
.qa-result .qa-body{flex:1;min-width:0}
.qa-result .qa-t{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-word}
.qa-result .qa-s{font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.45;word-break:break-word}
.qa-result .qa-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.qa-result .qa-actions a{font-size:12px}

.draft-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-top:12px}
.draft-box .draft-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:var(--text-2);word-break:break-word}
.draft-box .draft-meta{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}
.empty strong{display:block;color:var(--text-2);font-size:14px;font-weight:600;margin-bottom:4px}
.empty p{font-size:13px}

.alert{padding:12px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.5;margin-bottom:12px}
.alert.info{background:var(--info-bg);color:#93c5fd;border:1px solid rgba(59,130,246,.25)}
.alert.ok{background:var(--success-bg);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.alert.warn{background:var(--warning-bg);color:#fcd34d;border:1px solid rgba(245,158,11,.25)}
.alert.err{background:var(--error-bg);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}

/* ---------- Toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-bot));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{background:var(--surface-3);border:1px solid var(--border-h);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;display:flex;align-items:center;gap:9px;width:100%}
.toast svg{width:15px;height:15px;flex:none}
.toast.ok svg{color:var(--success)}
.toast.err svg{color:var(--error)}
.toast.info svg{color:var(--accent-l)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .2s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- Loading ---------- */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media(min-width:768px){
  .content{padding:26px 24px calc(40px + var(--safe-bot))}
  .topbar{padding:calc(12px + var(--safe-top)) 24px 12px}
  .page-head h1{font-size:25px}
}
@media(min-width:1024px){
  .sidebar{position:sticky;top:0;height:100vh;transform:none;z-index:10}
  .overlay{display:none!important}
  .menu-btn{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      </div>
      <div>
        <div class="brand-name">GrowthBot</div>
        <div class="brand-sub">Auto Traffic Engine</div>
      </div>
    </div>
    <div class="login-tabs" role="tablist">
      <button id="tabLogin" class="active" data-action="login-tab" data-tab="login">Sign in</button>
      <button id="tabSignup" data-action="login-tab" data-tab="signup">Create account</button>
    </div>
    <form id="authForm" novalidate>
      <label class="field" id="nameField" style="display:none">
        <span>Name</span>
        <input class="input" name="name" type="text" autocomplete="name" placeholder="Your name" />
      </label>
      <label class="field">
        <span>Email</span>
        <input class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </label>
      <label class="field">
        <span>Password</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" />
      </label>
      <div id="authError" class="alert err" style="display:none"></div>
      <button type="submit" class="btn btn-primary" id="authSubmit" style="width:100%;padding:11px">
        <span id="authBtnText">Sign in</span>
      </button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" style="display:none">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sb-brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      </div>
      <div>
        <div class="brand-name">GrowthBot</div>
        <div class="brand-sub">Auto Traffic</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Overview</div>
      <button class="nav-item active" data-action="nav" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <div class="nav-label">Growth tools</div>
      <button class="nav-item" data-action="nav" data-view="qa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Q&amp;A Finder</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="seo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>SEO Audit</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="directories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
        <span>Directories</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="indexer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><path d="m4.93 4.93 4.24 4.24"/><path d="M2 12h6"/><path d="m19.07 4.93-4.24 4.24"/><path d="M22 12h-6"/><path d="m16 16-4 4-4-4"/><path d="M12 12v8"/></svg>
        <span>Indexer</span>
      </button>

<script>
(function(){
'use strict';

// ============================================================
// STATE
// ============================================================
var state = {
  token: localStorage.getItem('gb.token') || '',
  user: null,
  plan: 'free',
  limits: null,
  businesses: [],
  currentBusiness: null,
  view: 'dashboard',
  qa: { country: 'ng', lastResults: [], lastKeyword: '', lastCountry: '', drafts: {} },
  seo: { lastResult: null },
  dir: { countries: [], lastSubmit: null },
  idx: { verify: null, jobs: [] }
};

function save() {
  if (state.token) localStorage.setItem('gb.token', state.token);
  else localStorage.removeItem('gb.token');
}

// ============================================================
// UTIL
// ============================================================
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function pct(n){return (Number(n)||0).toFixed(1)+'%'}
function today(){return new Date().toISOString().slice(0,10)}

var ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4Z"/></svg>'
};

function toast(msg, kind){
  var host = document.getElementById('toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (kind||'info');
  var ico = kind==='ok'?ICON.check:kind==='err'?ICON.alert:ICON.info;
  el.innerHTML = ico + '<span>' + esc(msg) + '</span>';
  host.appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 220); }, 2800);
}

// ============================================================
// API
// ============================================================
async function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  var res;
  try {
    res = await fetch(path, {
      method: opts.method || (opts.body ? 'POST' : 'GET'),
      headers: headers,
      body: opts.body ? (typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body)) : undefined
    });
  } catch (e) {
    return { ok: false, error: 'Network error: ' + e.message };
  }

  var data = null;
  try { data = await res.json(); } catch (e) { data = null; }

  if (res.status === 401) {
    handleLogout();
    return { ok: false, error: 'Session expired. Please sign in again.', unauthorized: true };
  }

  if (!res.ok) {
    return {
      ok: false,
      status: res.status,
      error: (data && (data.error || data.message)) || ('HTTP ' + res.status),
      data: data
    };
  }
  return { ok: true, data: data };
}

// ============================================================
// AUTH
// ============================================================
async function tryBoot(){
  if (!state.token) return showLogin();
  var r = await api('/api/auth/me');
  if (!r.ok || !r.data || !r.data.user) { handleLogout(); return; }
  state.user = r.data.user;
  await loadPlan();
  await loadBusinesses();
  showApp();
}

function showLogin(){
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('app').style.display = 'none';
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sbName').textContent = state.user.name || state.user.email;
  document.getElementById('sbEmail').textContent = state.user.email;
  document.getElementById('sbAvatar').textContent = (state.user.name || state.user.email || '?').charAt(0).toUpperCase();
  updatePlanBadge();
  render();
}

function handleLogout(){
  state.token = ''; state.user = null; save();
  showLogin();
}

async function loadPlan(){
  var r = await api('/api/check-plan');
  if (r.ok && r.data) {
    state.plan = r.data.plan || 'free';
    state.limits = r.data.limits || null;
    updatePlanBadge();
  }
}

async function loadBusinesses(){
  var r = await api('/api/businesses/list');
  if (r.ok && r.data) {
    state.businesses = r.data.businesses || [];
    state.currentBusiness = state.businesses[0] || null;
  }
}

function updatePlanBadge(){
  var el = document.getElementById('planBadge');
  if (!el) return;
  el.textContent = state.plan === 'premium' ? 'Premium' : 'Free';
  el.className = 'plan-badge' + (state.plan === 'premium' ? ' premium' : '');
}

document.getElementById('authForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var fd = new FormData(e.target);
  var name = String(fd.get('name') || '').trim();
  var email = String(fd.get('email') || '').trim();
  var password = String(fd.get('password') || '');
  var mode = document.getElementById('tabSignup').classList.contains('active') ? 'signup' : 'login';
  var errBox = document.getElementById('authError');
  errBox.style.display = 'none';

  if (!email || !password) { errBox.textContent = 'Email and password required.'; errBox.style.display = ''; return; }
  if (mode === 'signup' && password.length < 8) { errBox.textContent = 'Password must be at least 8 characters.'; errBox.style.display = ''; return; }

  var btn = document.getElementById('authSubmit');
  var btnTxt = document.getElementById('authBtnText');
  btn.disabled = true;
  btnTxt.innerHTML = '<span class="spinner"></span> ' + (mode === 'signup' ? 'Creating…' : 'Signing in…');

  var path = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
  var body = mode === 'signup' ? { email: email, password: password, name: name } : { email: email, password: password };
  var r = await api(path, { body: body });

  btn.disabled = false;
  btnTxt.textContent = mode === 'signup' ? 'Create account' : 'Sign in';

  if (!r.ok) {
    errBox.textContent = r.error || 'Authentication failed';
    errBox.style.display = '';
    return;
  }
  state.token = r.data.token;
  state.user = r.data.user;
  save();
  await loadPlan();
  await loadBusinesses();
  showApp();
  toast('Welcome, ' + (state.user.name || state.user.email), 'ok');
});

function handleLoginTab(tab){
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('nameField').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('authBtnText').textContent = tab === 'signup' ? 'Create account' : 'Sign in';
  document.getElementById('authError').style.display = 'none';
}

  html += '<div class="page-head"><div><h1>SEO Audit</h1><p>20+ checks on any URL. No business required.</p></div></div>';
  html += '<div class="card" style="margin-bottom:14px"><div class="row row-2">';
  html += '<label class="field" style="margin-bottom:0"><span>URL to audit</span><input class="input" id="seoUrl" placeholder="https://example.com" value="' + esc((state.currentBusiness && state.currentBusiness.website) || '') + '" /></label>';
  html += '<div style="display:flex;align-items:flex-end;gap:8px"><button class="btn btn-primary" data-action="seo-run" style="flex:1">' + ICON.zap + 'Run audit</button></div>';
  html += '</div></div>';

  var r = state.seo.lastResult;
  if (!r) {
    html += '<div class="card"><div class="empty">' + ICON.info + '<strong>No audit yet</strong><p>Enter a URL and click "Run audit".</p></div></div>';
    return html;
  }

  var scoreColor = r.score >= 80 ? 'var(--success)' : r.score >= 60 ? 'var(--warning)' : 'var(--error)';
  var dash = 2 * Math.PI * 50;
  var offset = dash * (1 - (r.score / 100));

  html += '<div class="card" style="margin-bottom:14px">';
  html += '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">';
  html += '<div class="score-ring">';
  html += '<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--surface-3)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="' + scoreColor + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/></svg>';
  html += '<div class="num" style="color:' + scoreColor + '">' + r.score + '<small>grade ' + (r.grade||'?') + '</small></div></div>';
  html += '<div style="flex:1;min-width:200px">';
  html += '<div style="font-size:15px;font-weight:600;word-break:break-all">' + esc(r.url) + '</div>';
  html += '<div style="color:var(--text-3);font-size:12.5px;margin-top:4px">TTFB ' + (r.metrics ? r.metrics.ttfb + 'ms' : '—') + ' · ' + (r.metrics ? r.metrics.pageSizeKb + ' KB' : '') + ' · ' + (r.metrics ? r.metrics.wordCount + ' words' : '') + '</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
  ['technical','onpage','content','social'].forEach(function(k){
    var v = (r.categories && r.categories[k]) ? r.categories[k].score : 0;
    html += '<span class="badge info">' + k + ': ' + v + '/100</span>';
  });
  html += '</div></div></div></div>';

  html += '<div class="card"><div class="card-head"><h2>Issues</h2><div class="right"><span class="badge warn">' + r.issues.length + '</span></div></div>';
  if (!r.issues.length) {
    html += '<div class="empty">' + ICON.check + '<strong>No issues found</strong><p>Excellent — everything passes.</p></div>';
  } else {
    r.issues.forEach(function(it){
      html += '<div class="issue ' + it.severity + '">';
      html += '<div class="ic">' + (it.severity === 'critical' ? ICON.alert : it.severity === 'warning' ? ICON.alert : ICON.info) + '</div>';
      html += '<div class="issue-body"><div class="t">' + esc(it.title) + '</div><div class="d">' + esc(it.description || '') + '</div>' + (it.fix ? '<div class="fix">' + esc(it.fix) + '</div>' : '') + '</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  if (r.passes && r.passes.length) {
    html += '<div class="card" style="margin-top:14px"><div class="card-head"><h2>Passing checks</h2><div class="right"><span class="badge ok">' + r.passes.length + '</span></div></div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    r.passes.forEach(function(p){ html += '<span class="badge ok">' + esc(p.title) + '</span>'; });
    html += '</div></div>';
  }
  return html;
};

document.addEventListener('click', async function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'login-tab') { handleLoginTab(el.getAttribute('data-tab')); return; }
  if (action === 'logout') { handleLogout(); toast('Signed out', 'ok'); return; }
  if (action === 'nav') { nav(el.getAttribute('data-view')); return; }

  if (action === 'show-business-form') {
    document.getElementById('businessFormSlot').innerHTML = businessFormHTML();
    var first = document.querySelector('#businessFormSlot input');
    if (first) first.focus();
    return;
  }
  if (action === 'hide-business-form') {
    document.getElementById('businessFormSlot').innerHTML = '';
    return;
  }
  if (action === 'use-business') {
    var id = Number(el.getAttribute('data-id'));
    var b = state.businesses.filter(function(x){ return x.id === id; })[0];
    if (b) { state.currentBusiness = b; toast('Using ' + b.name, 'ok'); render(); }
    return;
  }
  if (action === 'delete-business') {
    var did = Number(el.getAttribute('data-id'));
    var target = state.businesses.filter(function(x){ return x.id === did; })[0];
    if (!target) return;
    if (!confirm('Delete "' + target.name + '"?')) return;
    var r = await api('/api/businesses/' + did, { method: 'DELETE' });
    if (!r.ok) return toast(r.error || 'Delete failed', 'err');
    await loadBusinesses();
    toast('Deleted', 'ok'); render();
    return;
  }
  if (action === 'qa-find') {
    var kw = document.getElementById('qaKeyword').value.trim();
    var country = document.getElementById('qaCountry').value;
    if (!kw) return toast('Enter a keyword', 'err');
    el.disabled = true; var old = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Searching…';
    state.qa.lastKeyword = kw;
    state.qa.lastCountry = country;
    state.qa.country = country;
    var r = await api('/api/questions/find', { body: { keyword: kw, country: country } });
    el.disabled = false; el.innerHTML = old;
    if (!r.ok) return toast(r.error || 'Search failed', 'err');
    state.qa.lastResults = (r.data && r.data.questions) || [];
    state.qa.drafts = {};
    toast('Found ' + state.qa.lastResults.length + ' threads', 'ok');
    render();
    return;
  }
  if (action === 'qa-draft') {
    var idx = Number(el.getAttribute('data-idx'));
    var q = state.qa.lastResults[idx];
    if (!q) return;
    var blogUrl = document.getElementById('qaBlogUrl') ? document.getElementById('qaBlogUrl').value.trim() : '';
    if (!blogUrl) return toast('Enter a blog URL first', 'err');
    el.disabled = true; var old2 = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Drafting…';
    var biz = state.currentBusiness || {};
    var r2 = await api('/api/questions/draft', { body: {
      question: { title: q.title, snippet: q.snippet || '', source: q.source || 'generic' },
      business: { name: biz.name || '', website: biz.website || '', category: biz.category || '' },
      blogUrl: blogUrl,
      blogTitle: biz.name || 'Guide'
    }});
    el.disabled = false; el.innerHTML = old2;
    if (!r2.ok) return toast(r2.error || 'Draft failed', 'err');
    var d = r2.data && r2.data.draft;
    if (!d) return toast('No draft returned', 'err');
    state.qa.drafts[idx] = { text: d.draft_text || d.text || '', word_count: d.word_count || 0 };
    render();
    toast('Draft ready', 'ok');
    return;
  }
  if (action === 'copy-draft') {
    var ci = Number(el.getAttribute('data-idx'));
    var dd = state.qa.drafts[ci];
    if (!dd) return;
    try { await navigator.clipboard.writeText(dd.text); toast('Copied', 'ok'); }
    catch (err) { toast('Copy failed', 'err'); }
    return;
  }
  if (action === 'seo-run') {
    var url = document.getElementById('seoUrl').value.trim();
    if (!url) return toast('Enter a URL', 'err');
    el.disabled = true; var old3 = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Auditing…';
    var r3 = await api('/api/seo/audit', { body: { url: url } });
    el.disabled = false; el.innerHTML = old3;
    if (!r3.ok) return toast(r3.error || 'Audit failed', 'err');
    state.seo.lastResult = r3.data;
    render();
    toast('Audit complete (score ' + (r3.data.score || 0) + ')', 'ok');
    return;
  }
  if (action === 'idx-verify') {
    el.disabled = true; var old4 = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Checking…';
    var r4 = await api('/api/indexnow/verify');
    el.disabled = false; el.innerHTML = old4;
    state.idx.verify = r4.ok ? r4.data : { ok: false, error: r4.error };
    render();
    return;
  }
  if (action === 'idx-jobs') {
    var r5 = await api('/api/backlink/jobs');
    if (!r5.ok) return toast(r5.error || 'Failed', 'err');
    state.idx.jobs = (r5.data && r5.data.jobs) || [];
    render();
    return;
  }
  if (action === 'load-campaigns') {
    var bid = state.currentBusiness ? state.currentBusiness.id : 0;
    if (!bid) return;
    var r6 = await api('/api/businesses/' + bid + '/campaigns');
    if (!r6.ok) return toast(r6.error || 'Failed', 'err');
    var camps = r6.data.campaigns || [];
    var list = document.getElementById('campaignList');
    var body = '<div class="card-head"><h2>Recent campaigns</h2></div>';
    if (!camps.length) body += '<div style="color:var(--text-3);font-size:13px">No campaigns yet.</div>';
    else {
      body += '<div class="table-wrap" style="border:none"><table style="min-width:0"><thead><tr><th>Name</th><th>Status</th><th>Created</th></tr></thead><tbody>';
      camps.forEach(function(c){
        body += '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.status || '—') + '</td><td>' + (c.created_at ? new Date(c.created_at).toLocaleDateString() : '—') + '</td></tr>';
      });
      body += '</tbody></table></div>';
    }
    list.innerHTML = body;
    return;
  }
  if (action === 'load-leads') {
    var lbid = state.currentBusiness ? state.currentBusiness.id : 0;
    if (!lbid) return;
    var r7 = await api('/api/businesses/' + lbid + '/leads');
    if (!r7.ok) return toast(r7.error || 'Failed', 'err');
    var leads = r7.data.leads || [];
    var lhost = document.getElementById('leadList');
    if (!leads.length) { lhost.innerHTML = '<div style="color:var(--text-3);font-size:13px">No leads yet.</div>'; return; }
    var lb = '<div class="table-wrap" style="border:none"><table style="min-width:0"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>When</th></tr></thead><tbody>';
    leads.forEach(function(l){
      lb += '<tr><td>' + esc(l.name||'—') + '</td><td>' + esc(l.phone||'—') + '</td><td>' + esc(l.status||'—') + '</td><td>' + (l.created_at ? new Date(l.created_at).toLocaleDateString() : '—') + '</td></tr>';
    });
    lb += '</tbody></table></div>';
    lhost.innerHTML = lb;
    return;
  }
  if (action === 'social-load') {
    var r8 = await api('/api/social/accounts');
    if (!r8.ok) return toast(r8.error || 'Failed', 'err');
    var accts = r8.data.accounts || [];
    var shost = document.getElementById('socialList');
    if (!accts.length) { shost.innerHTML = '<div style="color:var(--text-3);font-size:13px">No accounts connected.</div>'; return; }
    var sHtml = '<div class="table-wrap" style="border:none"><table style="min-width:0"><thead><tr><th>Platform</th><th>Account</th><th>Expires</th></tr></thead><tbody>';
    accts.forEach(function(a){
      sHtml += '<tr><td>' + esc(a.platform) + '</td><td>' + esc(a.account_name || a.account_id) + '</td><td>' + (a.expires_at ? new Date(a.expires_at).toLocaleDateString() : '—') + '</td></tr>';
    });
    sHtml += '</tbody></table></div>';
    shost.innerHTML = sHtml;
    return;
  }
  if (action === 'upgrade-demo') {
    var ru = await api('/api/payment/demo-upgrade', { body: { email: state.user.email } });
    if (!ru.ok) return toast(ru.error || 'Upgrade failed', 'err');
    await loadPlan();
    toast('Upgraded to Premium', 'ok');
    render();
    return;
  }
  if (action === 'upgrade-real') {
    var rp = await api('/api/payment/init', { body: { email: state.user.email } });
    if (!rp.ok) return toast(rp.error || 'Payment init failed', 'err');
    toast('Payment flow ready. Add Flutterwave script to complete.', 'info');
    return;
  }
});

document.addEventListener('submit', async function(e){
  var form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  var kind = form.getAttribute('data-form');
  var fd = new FormData(form);

  if (kind === 'business') {
    var body = {};
    fd.forEach(function(v, k){ body[k] = v; });
    var r = await api('/api/businesses', { body: body });
    if (!r.ok) return toast(r.error || 'Create failed', 'err');
    await loadBusinesses();
    toast('Business created', 'ok');
    render();
    return;
  }

  if (kind === 'directory') {
    var dbody = {};
    fd.forEach(function(v, k){ dbody[k] = v; });
    if (dbody.categories) dbody.categories = dbody.categories.split(',').map(function(s){return s.trim()}).filter(Boolean);
    var rd = await api('/api/directories/submit', { body: dbody });
    state.dir.lastSubmit = rd.ok ? (rd.data || {}) : { ok: false, error: rd.error };
    if (!rd.ok) toast(rd.error || 'Submit failed', 'err');
    else toast('Listing submitted', 'ok');
    render();
    return;
  }

  if (kind === 'indexnow') {
    var lines = String(fd.get('urls') || '').split(/\s+/).filter(function(s){ return /^https?:\/\//i.test(s); });
    if (!lines.length) return toast('Enter at least one http(s) URL', 'err');
    var biz2 = state.currentBusiness || {};
    var ri = await api('/api/backlink/submit', { body: { urls: lines, businessId: biz2.id || null } });
    if (!ri.ok) return toast(ri.error || 'Submit failed', 'err');
    toast('Submitted ' + (ri.data.submitted || lines.length) + ' URL(s)', 'ok');
    var rj = await api('/api/backlink/jobs');
    if (rj.ok) state.idx.jobs = (rj.data.jobs || []);
    render();
    return;
  }

  if (kind === 'campaign') {
    if (!state.currentBusiness) return toast('Create a business first', 'err');
    var cbody = { businessId: state.currentBusiness.id, name: fd.get('name'), text: fd.get('text') || '' };
    var rc = await api('/api/campaigns', { body: cbody });
    if (!rc.ok) return toast(rc.error || 'Create failed', 'err');
    toast('Campaign created', 'ok');
    document.querySelector('[data-action="load-campaigns"]').click();
    form.reset();
    return;
  }

  if (kind === 'social-post') {
    var sbody = { platform: fd.get('platform'), message: fd.get('message'), link: fd.get('link') || null };
    var rs = await api('/api/social/post-now', { body: sbody });
    if (!rs.ok) return toast(rs.error || 'Post failed', 'err');
    toast('Posted', 'ok');
    form.reset();
    return;
  }
});

// ============================================================
// BOOT
// ============================================================
tryBoot();
})();
</script>
</body>
</html>
