<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upgrade to Premium — Auto Traffic Engine</title>
  <script src="https://checkout.flutterwave.com/v3.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #e4e4e7; --muted: #a1a1aa; --accent: #7c3aed; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .price { font-size: 40px; font-weight: 800; margin: 16px 0; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 16px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: white; box-sizing: border-box; }
    .status { margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <div style="font-size:40px">🚦</div>
    <h1>Unlock Premium</h1>
    <p style="color: var(--muted); font-size: 14px;">Get unlimited audits, AI videos, and Q&A across 55+ countries.</p>
    
    <div class="price">$29 <span style="font-size:16px; color:var(--muted); font-weight:400;">/month</span></div>
    
    <ul style="text-align:left; font-size:13px; line-height:1.8; color:var(--muted); padding-left:20px; margin:20px 0;">
      <li>Unlimited SEO Audits</li>
      <li>AI Video Ads (10–25s)</li>
      <li>Keyword Research & Clustering</li>
      <li>Q&A Finder + AI Drafts</li>
      <li>Backlink Tools (IndexNow + Listings)</li>
      <li>Social Auto-Posting</li>
    </ul>

    <input id="email" type="email" placeholder="Your email (for receipt)" required />
    <button class="btn" id="payBtn">Pay $29 with Flutterwave</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    (function() {
      // Get key from URL OR localStorage token
      const urlParams = new URLSearchParams(location.search);
      const API_KEY = urlParams.get('key') || localStorage.getItem('ate_token');
      const EMAIL_INPUT = document.getElementById('email');
      const PAY_BTN = document.getElementById('payBtn');
      const STATUS = document.getElementById('status');

      if (!API_KEY) {
        STATUS.innerHTML = '<span style="color:#ef4444">Missing API key. Please log in to the dashboard first.</span>';
        PAY_BTN.disabled = true;
        return;
      }

      // Prefill email from localStorage (if available)
      const user = JSON.parse(localStorage.getItem('ate_user') || '{}');
      if (user.email) EMAIL_INPUT.value = user.email;

      PAY_BTN.addEventListener('click', async function() {
        const email = EMAIL_INPUT.value.trim();
        if (!email) {
          STATUS.innerHTML = '<span style="color:#ef4444">Please enter your email.</span>';
          return;
        }

        PAY_BTN.disabled = true;
        PAY_BTN.textContent = 'Preparing checkout...';
        STATUS.innerHTML = '<span style="color:#a1a1aa">Connecting to Flutterwave...</span>';

        try {
          // 1. Init payment on server to get tx_ref and public_key
          const initRes = await fetch('/api/payment/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
            body: JSON.stringify({ email: email, key: API_KEY })
          });

          if (!initRes.ok) {
            const err = await initRes.json();
            throw new Error(err.error || 'Failed to initialize payment');
          }

          const initData = await initRes.json();

          if (!initData.public_key) {
            throw new Error('Flutterwave Public Key is missing on the server. Check your environment variables.');
          }

          // 2. Open Flutterwave Checkout
          FlutterwaveCheckout({
            public_key: initData.public_key,
            tx_ref: initData.tx_ref,
            amount: initData.amount,       
            currency: initData.currency,   
            payment_options: 'card,banktransfer,ussd',
            customer: { email: email, name: email.split('@')[0] },
            customizations: {
              title: 'Auto Traffic Engine Premium',
              description: 'Monthly Subscription — $29',
            },
            callback: function(response) {
              // Payment successful, now verify on server
              STATUS.innerHTML = '<span style="color:#10b981">Payment successful! Verifying...</span>';
              pollForPremium(API_KEY);
            },
            onclose: function() {
              PAY_BTN.disabled = false;
              PAY_BTN.textContent = 'Pay $29 with Flutterwave';
              STATUS.innerHTML = '<span style="color:#f59e0b">Checkout closed. You can try again.</span>';
            }
          });
        } catch (err) {
          STATUS.innerHTML = `<span style="color:#ef4444">Error: ${err.message}</span>`;
          PAY_BTN.disabled = false;
          PAY_BTN.textContent = 'Pay $29 with Flutterwave';
        }
      });

      async function pollForPremium(key) {
        let attempts = 0;
        const maxAttempts = 30; // 30 * 2s = 60s
        const interval = setInterval(async () => {
          attempts++;
          try {
            const res = await fetch('/api/check-plan?key=' + encodeURIComponent(key));
            const data = await res.json();
            
            if (data.plan === 'premium') {
              clearInterval(interval);
              document.getElementById('mainCard').innerHTML = `
                <div style="font-size:48px; margin-bottom:16px;">✅</div>
                <h2>You're Premium!</h2>
                <p style="color:var(--muted); font-size:14px;">Your account has been upgraded successfully.</p>
                <a href="/app.html" class="btn" style="display:block; text-decoration:none; margin-top:20px;">Go to Dashboard</a>
              `;
            } else if (attempts >= maxAttempts) {
              clearInterval(interval);
              STATUS.innerHTML = '<span style="color:#f59e0b">Verification taking longer than expected. Please check your dashboard in a minute.</span>';
            }
          } catch (e) {
            console.warn('Polling error:', e);
          }
        }, 2000);
      }
    })();
  </script>
</body>
</html>
