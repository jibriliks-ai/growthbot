<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Auto Traffic Engine</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface-2:#1a1a24;--surface-3:#23232e;--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#71717a;--accent:#8b5cf6;--accent-2:#6366f1;--accent-l:#c4b5fd;--accent-grad:linear-gradient(135deg,#8b5cf6,#6366f1);--accent-glow:rgba(139,92,246,0.25);--success:#10b981;--success-bg:rgba(16,185,129,0.12);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.12);--error:#ef4444;--error-bg:rgba(239,68,68,0.12);--info:#3b82f6;--info-bg:rgba(59,130,246,0.12);--r-sm:8px;--r-md:12px;--r-lg:16px;--shadow-md:0 4px 12px rgba(0,0,0,0.35);--shadow-lg:0 12px 32px rgba(0,0,0,0.45);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent-l);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30;overflow-y:auto}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);z-index:1}
.sidebar-logo{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 16px var(--accent-glow);overflow:hidden}
.sidebar-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.sidebar-title{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.sidebar-subtitle{font-size:10px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-group{margin-bottom:20px}
.nav-group-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;padding:0 10px 8px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13px;font-weight:500;transition:all .15s ease;cursor:pointer;width:100%;text-align:left;margin-bottom:2px;position:relative}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:rgba(139,92,246,0.12);color:var(--accent-l);font-weight:600}
.nav-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-link-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-link-lock{margin-left:auto;font-size:10px;opacity:0.7}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);text-align:center;flex-shrink:0}
.sidebar-plan{padding:10px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:var(--r-sm);margin-bottom:10px}
.sidebar-plan.premium{background:var(--accent-grad);border-color:transparent;color:#fff}
.sidebar-plan-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:0.85}
.sidebar-plan-name{font-size:13px;font-weight:700;margin-top:2px}
.main-wrap{flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0}
.mobile-header{background:rgba(19,19,26,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.hamburger{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .15s}
.mobile-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mobile-brand-mark{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 3px 12px var(--accent-glow);overflow:hidden}
.mobile-brand-mark img{width:100%;height:100%;object-fit:cover}
.mobile-brand-text{min-width:0;flex:1}
.mobile-brand-title{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.mobile-brand-sub{font-size:10px;color:var(--text-2);margin-top:1px;font-weight:500}
.plan-pill{padding:4px 9px;border-radius:999px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
.plan-pill.premium{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 0 12px var(--accent-glow)}
.header-logout-btn{width:36px;height:36px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;cursor:pointer;transition:all .15s}
.header-logout-btn:hover{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.4)}
@media(max-width:400px){.mobile-brand-title{font-size:0}.mobile-brand-title::after{content:"ATE";font-size:16px}.sidebar-title{font-size:0}.sidebar-title::after{content:"Auto Traffic Engine";font-size:12px}}
.content{flex:1;max-width:900px;width:100%;margin:0 auto;padding:20px 16px 100px;min-width:0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,26,0.92);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--border);display:flex;z-index:25;padding-bottom:var(--safe-bot)}
.bnav-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;font-size:9px;font-weight:600;color:var(--text-3);transition:color .2s;min-height:56px;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav-item .bn-icon{font-size:20px;line-height:1;transition:transform .2s}
.bnav-item.active{color:var(--accent-l)}
.bnav-item.active .bn-icon{transform:translateY(-1px)}
.bnav-item.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent-grad);border-radius:0 0 2px 2px;box-shadow:0 0 8px var(--accent-glow)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:60;opacity:0;visibility:hidden;transition:opacity .2s}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,85vw);background:var(--surface);border-right:1px solid var(--border);z-index:61;transform:translateX(-100%);transition:transform .28s cubic-bezier(0.32,0.72,0,1);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:calc(16px + var(--safe-top)) 16px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.drawer-close{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;margin-left:auto}
.drawer-nav{padding:16px 12px;flex:1}
.card{background:rgba(19,19,26,0.5);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:var(--border-h)}
.card-tight{padding:14px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;line-height:1.15;background:linear-gradient(135deg,var(--text) 40%,var(--accent-l));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.5}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin:20px 0 10px}
.section-title:first-child{margin-top:0}
.label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.label:first-child{margin-top:0}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.textarea{resize:vertical;min-height:70px;font-family:inherit}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.select option,.select optgroup{background:var(--surface);color:var(--text)}
.btn{width:100%;padding:12px 16px;border-radius:var(--r-md);background:var(--accent-grad);color:#fff;font-weight:600;font-size:14px;transition:transform .1s,box-shadow .15s,opacity .15s;margin-top:12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){box-shadow:0 0 24px var(--accent-glow)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover:not(:disabled){background:var(--surface-3);border-color:var(--border-h);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn.small{width:auto;padding:8px 14px;font-size:12px;min-height:34px;margin-top:8px;border-radius:var(--r-sm)}
.btn.danger{background:rgba(239,68,68,0.9);color:#fff}
.status{padding:12px 14px;border-radius:var(--r-sm);font-size:13px;margin-top:12px;line-height:1.5}
.status.info{background:var(--info-bg);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.status.success{background:var(--success-bg);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
.status.error{background:var(--error-bg);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.status.warning{background:var(--warning-bg);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent-l),#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;letter-spacing:-.02em}
.stat-label{font-size:10px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 8px 14px;text-align:center;transition:all .2s}
.quick:hover:not(:disabled){border-color:var(--border-h);transform:translateY(-2px)}
.quick:disabled{opacity:.4;cursor:not-allowed}
.quick-icon{font-size:28px;display:block;margin-bottom:6px;line-height:1}
.quick-label{font-size:12px;font-weight:600}
.quick-sub{font-size:10px;color:var(--text-3);margin-top:2px}
.score-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:24px 0;margin-bottom:16px;background:rgba(10,10,15,0.6);border-radius:var(--r-md);border:1px solid var(--border)}
.score-block{text-align:center}
.score-num{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent-l),#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.03em}
.score-num.good{background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.score-label{font-size:11px;color:var(--text-3);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.score-arrow{color:var(--accent-l);font-size:24px;opacity:.7}
.list{list-style:none;display:flex;flex-direction:column;gap:6px}
.list-item{padding:10px 12px;border-radius:var(--r-sm);font-size:12px;background:rgba(10,10,15,0.6);border-left:3px solid var(--border-h);color:var(--text-2);line-height:1.5}
.list-item.error{border-left-color:var(--error);color:#fca5a5}
.list-item.warning{border-left-color:var(--warning);color:#fcd34d}
.list-item.success{border-left-color:var(--success);color:#6ee7b7}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:10px 12px;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(139,92,246,0.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge.new{background:var(--accent-glow);color:var(--accent-l)}
.badge.delivered,.badge.posted,.badge.submitted,.badge.success{background:var(--success-bg);color:#6ee7b7}
.badge.pending,.badge.sent,.badge.clicked{background:var(--info-bg);color:#93c5fd}
.badge.failed,.badge.rejected{background:var(--error-bg);color:#fca5a5}
.badge.source{background:var(--surface-2);color:var(--text-2);text-transform:none}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-line{height:14px;margin-bottom:8px}
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:.6;display:inline-block}
.empty-title{font-size:16px;font-weight:700;margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--text-2);line-height:1.6;max-width:340px;margin:0 auto 16px}
.q-card{background:rgba(19,19,26,0.5);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px;transition:border-color .15s}
.q-card:hover{border-color:var(--border-h)}
.q-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.q-badge{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;margin-top:2px}
.q-badge.reddit{background:rgba(255,69,0,.15);color:#ff6b3d}
.q-badge.quora{background:rgba(185,43,39,.15);color:#e74c3c}
.q-badge.nairaland{background:var(--success-bg);color:#4ade80}
.q-badge.lemmy{background:rgba(14,165,233,.15);color:#38bdf8}
.q-badge.stackexchange{background:rgba(244,128,36,.15);color:#f48024}
.q-badge.default{background:var(--accent-glow);color:var(--accent-l)}
.q-title{font-size:13px;font-weight:600;line-height:1.4;flex:1}
.q-actions{display:flex;gap:6px;flex-wrap:wrap}
.draft-preview{background:rgba(10,10,15,.7);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.biz-switcher{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:11px;color:var(--text);cursor:pointer;max-width:120px;flex-shrink:0}
.toasts{position:fixed;bottom:calc(80px + var(--safe-bot));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{padding:11px 18px;border-radius:var(--r-md);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:toast-in .3s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(20px);pointer-events:auto}
.toast.success{background:rgba(16,185,129,.95);color:#fff}
.toast.error{background:rgba(239,68,68,.95);color:#fff}
.toast.info{background:rgba(59,130,246,.95);color:#fff}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.idle-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.idle-overlay.show{display:flex}
.idle-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.idle-icon{font-size:48px;margin-bottom:16px;display:inline-block}
.idle-title{font-size:18px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.idle-desc{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px}
.idle-countdown{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--warning),#ef4444);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:16px 0;letter-spacing:-.02em}
.idle-btns{display:flex;gap:8px;flex-direction:column}
.idle-btns .btn{margin-top:0}
#pwaBanner{position:fixed;bottom:calc(74px + var(--safe-bot));left:50%;transform:translateX(-50%);z-index:90;width:calc(100vw - 32px);max-width:480px;display:none;background:var(--accent-grad);color:#fff;padding:14px 18px;border-radius:var(--r-md);align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 28px rgba(139,92,246,0.4);animation:pwaSlideUp .35s cubic-bezier(.16,1,.3,1)}
#pwaBanner.show{display:flex}
#pwaBanner .text{font-size:13px;font-weight:600;flex:1;line-height:1.4}
#pwaBanner button{background:#fff;color:var(--accent);padding:8px 18px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap;flex-shrink:0;cursor:pointer}
@keyframes pwaSlideUp{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:1024px){#pwaBanner{left:calc(50% + 130px);bottom:24px}}
.listing-item{background:rgba(19,19,26,0.5);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.listing-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.listing-platform{font-weight:700;font-size:14px;color:var(--text)}
.listing-actions{display:flex;gap:6px;flex-wrap:wrap}
.listing-field{margin-top:8px}

<script>
(function(){
'use strict';

const TOKEN_KEY = 'ate_token';
const AUTH_TOKEN = localStorage.getItem(TOKEN_KEY);
const CURRENT_PATH = location.pathname + location.search;

if (!AUTH_TOKEN) {
  location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH));
  return;
}

// ============================================================
// PWA install banner
// ============================================================
let deferredPrompt;
const pwaBanner = document.getElementById('pwaBanner');
const pwaInstallBtn = document.getElementById('pwaInstallBtn');
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  if (pwaBanner) pwaBanner.classList.add('show');
});
if (pwaInstallBtn) pwaInstallBtn.addEventListener('click', async function(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  if (pwaBanner) pwaBanner.classList.remove('show');
});
window.addEventListener('appinstalled', function(){
  if (pwaBanner) pwaBanner.classList.remove('show');
  deferredPrompt = null;
});

// ============================================================
// Idle timeout
// ============================================================
const IDLE_TIMEOUT_MS = 25 * 60 * 1000;
const IDLE_WARN_MS = 60 * 1000;
const ACTIVITY_KEY = 'ate_last_activity';
const CHECK_INTERVAL_MS = 5 * 1000;
let idleCheckInterval = null;
let warnShown = false;
let countdownInterval = null;
let remainingSec = 60;

function touchActivity(){
  try { localStorage.setItem(ACTIVITY_KEY, String(Date.now())); } catch (e) {}
  if (warnShown) hideWarn();
}
function getLastActivity(){
  try { return parseInt(localStorage.getItem(ACTIVITY_KEY) || '0', 10) || Date.now(); }
  catch (e) { return Date.now(); }
}
function handleLogout(){
  if (confirm('Sign out of Auto Traffic Engine?')){
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem('ate_user');
    location.replace('/login.html');
  }
}
function forceLogout(reason){
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem('ate_user');
  location.replace('/login.html?expired=1&redirect=' + encodeURIComponent(location.pathname));
}
function showWarn(){
  if (warnShown) return;
  warnShown = true;
  const o = document.getElementById('idleOverlay');
  if (!o) return;
  o.classList.add('show');
  remainingSec = 60;
  updateCountdown();
  clearInterval(countdownInterval);
  countdownInterval = setInterval(function(){
    remainingSec -= 1;
    if (remainingSec <= 0) { clearInterval(countdownInterval); return; }
    updateCountdown();
  }, 1000);
}
function hideWarn(){
  warnShown = false;
  const o = document.getElementById('idleOverlay');
  if (o) o.classList.remove('show');
  clearInterval(countdownInterval);
}
function updateCountdown(){
  const el = document.getElementById('idleCountdown');
  if (el) el.textContent = String(remainingSec);
}
function checkIdle(){
  if (!localStorage.getItem(TOKEN_KEY)) return;
  const idleMs = Date.now() - getLastActivity();
  if (idleMs >= IDLE_TIMEOUT_MS) { forceLogout('idle'); return; }
  if (idleMs >= IDLE_TIMEOUT_MS - IDLE_WARN_MS){
    if (!warnShown) showWarn();
    const s = Math.ceil((IDLE_TIMEOUT_MS - idleMs) / 1000);
    if (s < remainingSec) { remainingSec = s; updateCountdown(); }
  }
}
function startIdleWatcher(){
  ['mousemove','mousedown','keydown','touchstart','scroll','click','focus'].forEach(function(ev){
    document.addEventListener(ev, touchActivity, { passive: true });
  });
  if (!localStorage.getItem(ACTIVITY_KEY)) touchActivity();
  idleCheckInterval = setInterval(checkIdle, CHECK_INTERVAL_MS);
}
window.addEventListener('storage', function(e){
  if (e.key === TOKEN_KEY && !e.newValue) location.replace('/login.html');
  if (e.key === ACTIVITY_KEY && warnShown) hideWarn();
});

// ============================================================
// Global state
// ============================================================
const BACKEND = location.origin;
const state = {
  user: null,
  apiKey: '',
  plan: 'free',
  usage: {},
  limits: { freeAudits: 3, premiumVideos: 30, backlinks: 10, businesses: 1, price: 29 },
  business: null,
  businesses: [],
  analytics: null,
  countries: [],
  dirCountries: [],
  tab: 'home',
  isAdmin: false
};
const $ = function(id){ return document.getElementById(id); };
const content = $('content');

const NAV_GROUPS = [
  { label: 'Main', items: [ { key: 'home', icon: '🏠', label: 'Home' } ]},
  { label: 'Content', items: [
    { key: 'seo', icon: '🔍', label: 'SEO Audit' },
    { key: 'video', icon: '🎬', label: 'Video Ads', premium: true },
    { key: 'keywords', icon: '🔑', label: 'Keywords', premium: true }
  ]},
  { label: 'Outreach', items: [
    { key: 'qa', icon: '💬', label: 'Q&A Finder', premium: true },
    { key: 'directories', icon: '📇', label: 'Directories', premium: true },
    { key: 'backlinks', icon: '🔗', label: 'Indexer', premium: true },
    { key: 'social', icon: '📱', label: 'Social', premium: true }
  ]},
  { label: 'Business', items: [
    { key: 'campaigns', icon: '📣', label: 'Campaigns' },
    { key: 'leads', icon: '👥', label: 'Leads' },
    { key: 'reviews', icon: '⭐', label: 'Reviews' },
    { key: 'analytics', icon: '📊', label: 'Analytics' }
  ]},
  { label: 'Account', items: [
    { key: 'businesses', icon: '🏢', label: 'Businesses' },
    { key: 'kb', icon: '📖', label: 'Knowledge Base' },
    { key: 'settings', icon: '⚙️', label: 'Settings' }
  ]}
];
const BOTTOM_NAV = [
  { key: 'home', icon: '🏠', label: 'Home' },
  { key: 'seo', icon: '🔍', label: 'SEO' },
  { key: 'video', icon: '🎬', label: 'Video', premium: true },
  { key: 'qa', icon: '💬', label: 'Q&A', premium: true },
  { key: 'menu', icon: '☰', label: 'Menu', action: 'drawer' }
];

// ============================================================
// Helpers
// ============================================================
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function toast(msg, type){
  type = type || 'success';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,12px)';
    el.style.transition = 'all .3s';
    setTimeout(function(){ el.remove(); }, 300);
  }, 3000);
}

async function copy(text, label){
  try {
    await navigator.clipboard.writeText(text);
    toast(label || 'Copied!');
  } catch (e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'absolute';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(label || 'Copied!'); }
    catch (e2){ toast('Copy failed', 'error'); }
    finally { ta.remove(); }
  }
}

async function api(path, opts){
  const options = Object.assign({ method: 'GET' }, opts || {});
  if (options.body && typeof options.body !== 'string'){
    options.body = JSON.stringify(options.body);
    options.headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  }
  options.headers = Object.assign(
    { 'Authorization': 'Bearer ' + (localStorage.getItem(TOKEN_KEY) || '') },
    options.headers || {}
  );
  const res = await fetch(BACKEND + path, options);
  if (res.status === 401){
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem('ate_user');
    location.replace('/login.html?redirect=' + encodeURIComponent(CURRENT_PATH) + '&expired=1');
    throw new Error('Session expired');
  }
  const data = await res.json().catch(function(){ return {}; });
  if (!res.ok){
    const err = new Error(data.error || data.message || ('HTTP ' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ============================================================
// Navigation
// ============================================================
function buildNavHTML(activeKey){
  const isFree = state.plan === 'free';
  const isAdmin = state.isAdmin;
  let html = NAV_GROUPS.map(function(group){
    return '<div class="nav-group">' +
      '<div class="nav-group-label">' + esc(group.label) + '</div>' +
      group.items.map(function(item){
        return '<button class="nav-link ' + (activeKey === item.key ? 'active' : '') + '" data-tab="' + item.key + '">' +
          '<span class="nav-link-icon">' + item.icon + '</span>' +
          '<span>' + esc(item.label) + '</span>' +
          (item.premium && isFree && !isAdmin ? '<span class="nav-link-lock">🔒</span>' : '') +
        '</button>';
      }).join('') +
    '</div>';
  }).join('');
  if (isAdmin){
    html += '<div class="nav-group"><div class="nav-group-label" style="color:#f59e0b;">🛡️ Admin</div>' +
      '<a href="/admin.html" class="nav-link" style="text-decoration:none;color:#fcd34d;">' +
      '<span class="nav-link-icon">🛡️</span><span>Admin Panel</span><span class="nav-link-lock">↗</span></a></div>';
  }
  return html;
}

function renderNav(){
  const isFree = state.plan === 'free';
  const isAdmin = state.isAdmin;
  const navHtml = buildNavHTML(state.tab);
  $('sidebarNav').innerHTML = navHtml;
  $('drawerNav').innerHTML = navHtml;
  ['sidebarNav','drawerNav'].forEach(function(id){
    $(id).querySelectorAll('[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const target = btn.getAttribute('data-tab');
        closeDrawer();
        navigateTo(target);
      });
    });
  });

  const footerHTML =
    '<div class="sidebar-plan ' + (state.plan === 'premium' ? 'premium' : '') + '">' +
      '<div class="sidebar-plan-label">' + (state.plan === 'premium' ? '⭐ Premium' : 'Free Plan') + '</div>' +
      '<div class="sidebar-plan-name">' + (state.plan === 'premium' ? 'Active' : 'Upgrade available') + '</div>' +
    '</div>' +
    '<button class="btn ghost small" data-logout-btn style="width:100%; color:#ef4444; border-color:rgba(239,68,68,0.3); margin-bottom:8px;">⏻ Sign Out</button>' +
    '<div style="font-size:10px;color:var(--text-3);">Auto Traffic Engine v3.8.1</div>';

  const sFooter = $('sidebarFooter');
  const dFooter = $('drawerFooter');
  if (sFooter) sFooter.innerHTML = footerHTML;
  if (dFooter) dFooter.innerHTML = footerHTML;
  document.querySelectorAll('[data-logout-btn]').forEach(function(btn){
    btn.addEventListener('click', handleLogout);
  });

  $('bottomNav').innerHTML = BOTTOM_NAV.map(function(item){
    const isActive = item.action !== 'drawer' && state.tab === item.key;
    return '<button class="bnav-item ' + (isActive ? 'active' : '') + '" data-bnav="' + item.key + '">' +
      '<span class="bn-icon">' + item.icon + '</span>' +
      '<span>' + esc(item.label) + '</span>' +
      (item.premium && isFree && !isAdmin ? '<span class="bn-lock">🔒</span>' : '') +
    '</button>';
  }).join('');
  $('bottomNav').querySelectorAll('[data-bnav]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const key = btn.getAttribute('data-bnav');
      if (key === 'menu') { openDrawer(); return; }
      navigateTo(key);
    });
  });
}

function navigateTo(target){
  if (target === state.tab) return;
  let tabDef = null;
  NAV_GROUPS.forEach(function(g){
    g.items.forEach(function(i){ if (i.key === target) tabDef = i; });
  });
  if (tabDef && tabDef.premium && state.plan === 'free' && !state.isAdmin){
    renderUpgrade(target);
    return;
  }
  state.tab = target;
  renderNav();
  renderTab();
  window.scrollTo(0, 0);
}

function openDrawer(){
  $('drawer').classList.add('open');
  $('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer(){
  $('drawer').classList.remove('open');
  $('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function updateHeader(){
  $('mobileBrandTitle').textContent = (state.business && state.business.name) || 'Auto Traffic Engine';
  $('mobileBrandSub').textContent = (state.business && state.business.category) || 'Business growth tools';
  const pill = $('planPill');
  if (state.isAdmin){
    pill.textContent = '🛡️ Admin';
    pill.classList.add('premium');
  } else if (state.plan === 'premium'){
    pill.textContent = '⭐ Premium';
    pill.classList.add('premium');
  } else {
    pill.textContent = 'Free';
    pill.classList.remove('premium');
  }
  const sw = $('bizSwitcher');
  if (state.businesses.length <= 1){
    sw.classList.add('hidden');
  } else {
    sw.classList.remove('hidden');
    sw.innerHTML = state.businesses.map(function(b){
      return '<option value="' + b.id + '" ' + (state.business && state.business.id === b.id ? 'selected' : '') + '>' + esc(b.name) + '</option>';
    }).join('');
    sw.onchange = function(e){
      const id = Number(e.target.value);
      const biz = state.businesses.find(function(b){ return b.id === id; });
      if (biz){
        state.business = biz;
        updateHeader();
        loadAnalytics().then(function(){ renderTab(); });
      }
    };
  }
}

// ============================================================
// Data loaders
// ============================================================
async function loadPlan(){
  try {
    const d = await api('/api/check-plan?key=' + encodeURIComponent(state.apiKey) + '&url=' + encodeURIComponent(location.href));
    state.plan = d.plan || 'free';
    state.usage = d.usage || {};
    state.limits = Object.assign(state.limits, d.limits || {});
    state.isAdmin = d.isAdmin === true;
  } catch (e){ console.warn('Plan:', e.message); }
}

async function loadBusinesses(){
  try {
    const r = await api('/api/businesses/list');
    state.businesses = r.businesses || [];
    state.business = state.businesses[0] || null;
    state.limits.businesses = r.limit || state.limits.businesses;
  } catch (e){
    state.businesses = [];
    state.business = null;
  }
}

async function loadAnalytics(){
  if (!state.business){ state.analytics = null; return; }
  let base = {};
  try {
    const r = await api('/api/businesses/' + state.business.id + '/analytics');
    base = r.analytics || {};
  } catch (e) {}
  let linkStats = { links: 0, clicks: 0 };
  try {
    const r = await api('/api/businesses/' + state.business.id + '/link-stats');
    linkStats = r || linkStats;
  } catch (e) {}
  state.analytics = Object.assign({}, base, {
    links: linkStats.links || 0,
    clicks: linkStats.clicks || 0
  });
}

async function loadCountries(){
  try {
    const r = await api('/api/questions/sources');
    state.countries = r.countries || [];
  } catch (e){ state.countries = []; }
}

async function loadDirCountries(){
  try {
    const r = await api('/api/directories/countries');
    state.dirCountries = r.countries || [];
  } catch (e){ state.dirCountries = []; }
}

// ============================================================
// Tab router
// ============================================================
function renderTab(){
  content.scrollTop = 0;
  switch (state.tab){
    case 'home': return renderHome();
    case 'seo': return renderSEO();
    case 'video': return renderVideo();
    case 'keywords': return renderKeywords();
    case 'qa': return renderQA();
    case 'directories': return renderDirectories();
    case 'backlinks': return renderBacklinks();
    case 'social': return renderSocial();
    case 'campaigns': return renderCampaigns();
    case 'leads': return renderLeads();
    case 'reviews': return renderReviews();
    case 'analytics': return renderAnalytics();
    case 'businesses': return renderBusinesses();
    case 'kb': return renderKnowledgeBase();
    case 'settings': return renderSettings();
    default: return renderHome();
  }
}

// ============================================================
// HOME
// ============================================================
function renderHome(){
  const audits = state.usage.auditsToday || 0;
  const videos = state.usage.videosMonth || 0;
  const leads = (state.analytics && state.analytics.leads) || 0;
  const clicks = (state.analytics && state.analytics.clicks) || 0;
  const links = (state.analytics && state.analytics.links) || 0;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const name = (state.user && (state.user.name || state.user.email)) || 'there';

  content.innerHTML =
    '<h1 class="h1">' + esc(greet) + ', ' + esc(name) + '!</h1>' +
    '<p class="subtitle">Here\'s your growth overview' + (state.business ? ' for ' + esc(state.business.name) : '') + '.</p>' +
    (state.plan === 'free' && !state.isAdmin ?
      '<div class="card" style="background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(99,102,241,0.1));border-color:rgba(139,92,246,0.3);">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-l);margin-bottom:8px;">Upgrade to Premium</div>' +
        '<div style="font-size:16px;font-weight:700;margin-bottom:6px;">Unlock every growth tool</div>' +
        '<div style="font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.5;">Video ads, keyword research, Q&A finder, social posting, directory listings, and unlimited audits.</div>' +
        '<button class="btn" onclick="location.href=\'/pay.html\'">Upgrade for $' + state.limits.price + '/mo</button>' +
      '</div>'
      : '') +
    '<div class="stats">' +
      '<div class="stat"><div class="stat-num">' + links + '</div><div class="stat-label">Tracked Links</div></div>' +
      '<div class="stat"><div class="stat-num">' + clicks + '</div><div class="stat-label">Clicks</div></div>' +
      '<div class="stat"><div class="stat-num">' + leads + '</div><div class="stat-label">Leads</div></div>' +
    '</div>' +
    (!state.business ?
      '<div class="card"><div class="empty">' +

  $('auditBtn').addEventListener('click', async function(){
    const url = $('auditUrl').value.trim();

    $('auditBtn').disabled = true;

    $('auditResult').innerHTML = '';
    try {

    } catch (e){

        $('auditResult').innerHTML = '<div class="status warning">Daily free limit reached. Upgrade for unlimited audits.</div>';

      $('auditBtn').disabled = false;
      $('auditBtn').textContent = 'Run SEO Audit';

function renderAuditResult(r){
  const before = (r.before && r.before.score) != null ? r.before.score : 0;
  const after = (r.after && r.after.score) != null ? r.after.score : null;
  const issues = (r.before && r.before.issues) || [];
  const fixes = r.fixes || [];
  let html = '<div class="score-row">' +
    '<div class="score-block"><div class="score-num ' + (before >= 70 ? 'good' : '') + '">' + before + '</div><div class="score-label">Current</div></div>' +
    (after !== null ? '<div class="score-arrow">→</div><div class="score-block"><div class="score-num good">' + after + '</div><div class="score-label">After Fix</div></div>' : '') +
    '</div>';
  if (issues.length){
    html += '<div class="section-title">Issues Found (' + issues.length + ')</div><ul class="list">';
    issues.slice(0, 20).forEach(function(i){
      html += '<li class="list-item ' + (i.severity || 'warning') + '"><strong>' + esc(i.type || 'Issue') + ':</strong> ' + esc(i.description || i.detail || '') + '</li>';
    });
    html += '</ul>';
  }
  if (fixes.length){
    html += '<div class="section-title">Recommended Fixes</div><ul class="list">';
    fixes.slice(0, 15).forEach(function(f){
      html += '<li class="list-item success"><strong>' + esc(f.title || 'Fix') + ':</strong> ' + esc(f.description || f.detail || '') + '</li>';
    });
    html += '</ul>';
  }
  $('auditResult').innerHTML = html;
}

      $('qaResult').querySelectorAll('[data-draft-q]').forEach(function(b){
        b.addEventListener('click', async function(){

          const q = questions[i];

          b.disabled = true;
          b.innerHTML = '<span class="spin"></span>Drafting...';

            const draftText =
              (d.draft && (d.draft.draft_text || d.draft.draftText || d.draft.text || d.draft.content)) || '';
            slot.innerHTML =
              '<div class="draft-preview">' + esc(draftText || 'Draft generated.') + '</div>' +
              '<button class="btn small" data-copy-draft="' + i + '">Copy Answer</button>';
            slot.querySelector('[data-copy-draft]').addEventListener('click', function(){
              copy(draftText, 'Answer copied!');

            slot.innerHTML = '<div class="status error" style="margin-top:8px;">' + esc(e.message) + '</div>';
          } finally {
            b.disabled = false;
            b.textContent = 'Draft Answer';
          }
        });
      });
    } catch (e){
      $('qaResult').innerHTML = '<div class="status error">' + esc(e.message) + '</div>';
    } finally {
      $('qaBtn').disabled = false;
      $('qaBtn').textContent = 'Find Questions';
    }
  });
}

        $('dirPostings').innerHTML =
          '<div class="section-title">Already Submitted (' + postings.length + ')</div>' +

            const liveUrl = p.listing_url || p.listingUrl || p.posted_url;

              '<div class="listing-header">' +

              (liveUrl ? '<div class="listing-field"><div class="listing-field-label">Live URL</div><div class="listing-field-value"><a href="' + esc(liveUrl) + '" target="_blank" rel="noopener">' + esc(liveUrl) + '</a></div></div>' : '') +
              (tracked ? '<div class="listing-field"><div class="listing-field-label">Tracked Link (clicks → Leads)</div><div class="listing-field-value"><a href="' + esc(tracked) + '" target="_blank" rel="noopener">' + esc(tracked) + '</a></div></div>' : '') +

      }
      renderDirectoryListings(listings);
    } catch (e){
      $('dirResults').innerHTML = '<div class="status error" style="margin-top:16px;">' + esc(e.message) + '</div>';
    } finally {
      $('dirFindBtn').disabled = false;
      $('dirFindBtn').textContent = 'Show Classified Sites';
    }

function renderDirectoryListings(listings){
  const typeBadge = function(t){
    const map = { General: 'new', RealEstate: 'pending', Jobs: 'clicked', Cars: 'success', Services: 'pending', Business: 'new' };
    return '<span class="badge ' + (map[t] || 'source') + '">' + esc(t || 'General') + '</span>';
  };

  $('dirResults').innerHTML =
    '<div class="section-title">Available Sites (' + listings.length + ') — Click <strong>Copy &amp; Open</strong> on any site</div>' +
    listings.map(function(l, i){
      return '<div class="listing-item">' +
        '<div class="listing-header">' +
          '<div class="listing-platform">' + esc(l.name) + '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + typeBadge(l.type) +
            (l.da ? '<span class="badge source">DA ' + esc(l.da) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="listing-field">' +
          '<div class="listing-field-label">Website</div>' +
          '<div class="listing-field-value"><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.url) + '</a></div>' +
        '</div>' +
        '<button class="btn" data-copy-open="' + i + '" style="margin-top:10px;">📋 Copy Sales Copy &amp; Open Site</button>' +
        '<div id="dir-slot-' + i + '"></div>' +
      '</div>';
    }).join('');

  $('dirResults').querySelectorAll('[data-copy-open]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const i = Number(btn.getAttribute('data-copy-open'));
      const l = listings[i];
      const slot = $('dir-slot-' + i);

      // 1. Open the directory IMMEDIATELY (user gesture — no popup block)
      const target = l.submitUrl || l.url;
      window.open(target, '_blank', 'noopener,noreferrer');

      // 2. Load state
      btn.disabled = true;
      const originalLabel = btn.innerHTML;
      btn.innerHTML = '<span class="spin"></span>Generating copy...';
      slot.innerHTML = '';

      try {
        // 3. Generate tracked link + sales copy
        const r = await api('/api/directories/generate', {
          method: 'POST',
          body: {
            businessId: state.business.id,
            directory: { name: l.name, url: l.url, submitUrl: l.submitUrl, type: l.type }
          }
        });

        // 4. Copy to clipboard
        await copy(r.salesCopy, '✅ Sales copy copied! Paste it in the ad form.');

        // 5. Show preview + mark-as-posted
        slot.innerHTML =
          '<div class="listing-field" style="margin-top:10px;">' +
            '<div class="listing-field-label">✅ Sales Copy (already copied to clipboard)</div>' +
            '<div class="listing-field-value" style="white-space:pre-wrap;font-family:\'JetBrains Mono\',monospace;font-size:11.5px;line-height:1.6;">' + esc(r.salesCopy) + '</div>' +
            '<button class="btn small secondary" data-recopy="' + i + '" style="margin-top:6px;">Copy Again</button>' +
          '</div>' +
          '<div class="listing-field">' +
            '<div class="listing-field-label">Your Tracked Link (embedded in the copy)</div>' +
            '<div class="listing-field-value"><a href="' + esc(r.trackedUrl) + '" target="_blank" rel="noopener">' + esc(r.trackedUrl) + '</a> — every click is logged as a Lead</div>' +
          '</div>' +
          '<div style="margin-top:12px;">' +
            '<label class="label">After posting, paste the live URL of your ad</label>' +
            '<input class="input" id="dir-url-' + i + '" placeholder="https://site.com/your-listing" />' +
            '<button class="btn small" data-mark-posted="' + i + '" style="margin-top:8px;">✓ Mark as Posted</button>' +
          '</div>' +
          '<div id="dir-done-' + i + '"></div>';

        slot.querySelector('[data-recopy="' + i + '"]').addEventListener('click', function(){
          copy(r.salesCopy, 'Copied again!');
        });

        slot.querySelector('[data-mark-posted="' + i + '"]').addEventListener('click', async function(){
          const liveUrl = $('dir-url-' + i).value.trim();
          if (!liveUrl) return toast('Paste the live URL first', 'error');
          const markBtn = slot.querySelector('[data-mark-posted="' + i + '"]');
          markBtn.disabled = true;
          markBtn.innerHTML = '<span class="spin"></span>Saving...';
          try {
            await api('/api/directories/mark-posted', {
              method: 'POST',
              body: {
                businessId: state.business.id,
                platform: l.name,
                listingUrl: liveUrl
              }
            });
            $('dir-done-' + i).innerHTML =
              '<div class="status success" style="margin-top:8px;">' +
                '<strong>Logged!</strong> Your ad URL is saved. Clicks on <code>' + esc(r.trackedUrl) + '</code> will appear in <strong>Leads</strong> for retargeting.' +
              '</div>';
            markBtn.textContent = '✓ Posted';
            loadAnalytics();
          } catch (e){
            $('dir-done-' + i).innerHTML = '<div class="status error" style="margin-top:8px;">' + esc(e.message) + '</div>';
            markBtn.disabled = false;
            markBtn.textContent = '✓ Mark as Posted';
          }
        });
      } catch (e){
        slot.innerHTML = '<div class="status error" style="margin-top:10px;">' + esc(e.message) + '</div>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    });
  });
}

      '<textarea class="textarea" id="blUrls" rows="6" placeholder="https://example.com/page-1&#10;https://example.com/page-2"></textarea>' +
      '<button class="btn" id="blSubmitBtn">Submit for Indexing</button>' +
      '<div id="blResult"></div>' +
    '</div>' +
    '<div id="blJobs"></div>';

  loadBacklinkJobs();

  $('blSubmitBtn').addEventListener('click', async function(){
    const raw = $('blUrls').value.trim();
    if (!raw) return toast('Paste at least one URL', 'error');
    const urls = raw
      .split(/[\n,]+/)
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return /^https?:\/\//i.test(s); });
    if (!urls.length) return toast('No valid URLs found', 'error');
    if (!state.business) return toast('Add a business first', 'error');

    $('blSubmitBtn').disabled = true;
    $('blSubmitBtn').innerHTML = '<span class="spin"></span>Submitting...';
    $('blResult').innerHTML = '';
    try {
      const r = await api('/api/backlink/submit', {
        method: 'POST',
        body: { businessId: state.business.id, urls: urls }
      });
      const success = r.indexnow && r.indexnow.ok;
      const statusCode = (r.indexnow && r.indexnow.statusCode) || '—';
      $('blResult').innerHTML =
        '<div class="status ' + (success ? 'success' : 'warning') + '" style="margin-top:16px;">' +
          '<strong>' + (success ? '✅ Submitted to IndexNow' : '⚠️ Submission issue') + '</strong><br>' +
          'Status code: ' + esc(statusCode) + '<br>' +
          'Engines covered: <strong>Bing, Yandex, Seznam, Naver</strong>' +
          (r.indexnow && r.indexnow.error ? '<br><span style="color:var(--error);">' + esc(r.indexnow.error) + '</span>' : '') +
          (r.google && r.google.note ? '<div style="margin-top:10px;font-size:12px;color:var(--text-2);line-height:1.5;"><strong>Google:</strong> ' + esc(r.google.note) + '</div>' : '') +
        '</div>' +
        (r.jobs && r.jobs.length ?
          '<div class="section-title">Submitted URLs (' + r.jobs.length + ')</div>' +
          r.jobs.map(function(j, i){
            return '<div class="listing-item">' +
              '<div class="listing-field"><div class="listing-field-label">URL</div>' +
                '<div class="listing-field-value"><a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.url) + '</a></div></div>' +
              (j.trackedUrl ?
                '<div class="listing-field"><div class="listing-field-label">Tracked Link (clicks → Leads)</div>' +
                  '<div class="listing-field-value"><a href="' + esc(j.trackedUrl) + '" target="_blank" rel="noopener">' + esc(j.trackedUrl) + '</a> ' +
                  '<button class="btn small secondary" data-copy-tracked="' + i + '" style="width:auto;padding:3px 8px;min-height:0;font-size:11px;margin-left:6px;">Copy</button></div></div>'
                : '') +
            '</div>';
          }).join('') : '');
      $('blResult').querySelectorAll('[data-copy-tracked]').forEach(function(b){
        b.addEventListener('click', function(){
          const idx = Number(b.getAttribute('data-copy-tracked'));
          copy(r.jobs[idx].trackedUrl, 'Tracked link copied!');
        });
      });
      loadBacklinkJobs();
      loadAnalytics();
    } catch (e){
      $('blResult').innerHTML = '<div class="status error" style="margin-top:16px;">' + esc(e.message) + '</div>';
    } finally {
      $('blSubmitBtn').disabled = false;
      $('blSubmitBtn').textContent = 'Submit for Indexing';
    }
  });
}

async function loadBacklinkJobs(){
  const el = $('blJobs');
  if (!el) return;
  try {
    const r = await api('/api/backlink/jobs');
    const jobs = r.jobs || [];
    if (!jobs.length){
      el.innerHTML = '';
      return;
    }
    el.innerHTML =
      '<div class="section-title">Recent Submissions (' + jobs.length + ')</div>' +
      jobs.slice(0, 20).map(function(j){
        const result = j.result || {};
        const trackedUrl = result.trackedUrl;
        const badge = j.status === 'success' ? 'success' : j.status === 'failed' ? 'failed' : 'pending';
        const when = ((j.created_at || '') + '').toString().slice(0, 16);
        return '<div class="listing-item">' +
          '<div class="listing-header">' +
            '<div class="listing-platform" style="word-break:break-all;font-size:12px;">' + esc(j.url) + '</div>' +
            '<span class="badge ' + badge + '">' + esc(j.status) + '</span>' +
          '</div>' +
          '<div style="font-size:11px;color:var(--text-3);margin-top:4px;">Submitted: ' + esc(when) + '</div>' +
          (trackedUrl ?
            '<div class="listing-field" style="margin-top:8px;"><div class="listing-field-label">Tracked Link</div>' +
              '<div class="listing-field-value"><a href="' + esc(trackedUrl) + '" target="_blank" rel="noopener">' + esc(trackedUrl) + '</a></div></div>'
            : '') +
        '</div>';
      }).join('');
  } catch (e) {
    console.warn('Jobs load:', e.message);
  }
}

    backlinks: 'Search Engine Indexer',
    social: 'Social Posting'
  };
  content.innerHTML =
    '<h1 class="h1">' + esc(labels[tabKey] || 'Premium Feature') + '</h1>' +
    '<p class="subtitle">This tool is part of the Premium plan.</p>' +
    '<div class="card" style="background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(99,102,241,0.1));border-color:rgba(139,92,246,0.3);text-align:center;padding:32px 20px;">' +
      '<div style="font-size:48px;margin-bottom:12px;">⭐</div>' +
      '<div style="font-size:18px;font-weight:800;margin-bottom:8px;">Unlock every growth tool</div>' +
      '<div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:20px;max-width:360px;margin-left:auto;margin-right:auto;">Video ads, keyword research, Q&amp;A finder, directory listings, search engine indexer, social posting, and unlimited SEO audits.</div>' +
      '<button class="btn" onclick="location.href=\'/pay.html\'">Upgrade for $' + state.limits.price + '/mo</button>' +
      '<button class="btn ghost small" onclick="window.navigateTo(\'home\')" style="margin-top:8px;">Back to Home</button>' +
    '</div>';
}

// ============================================================
// INIT
// ============================================================
window.navigateTo = navigateTo;

async function init(){
  try { state.user = JSON.parse(localStorage.getItem('ate_user') || 'null'); }
  catch (e){ state.user = null; }
  state.apiKey = (state.user && (state.user.apiKey || state.user.api_key)) || '';

  if (!state.user){
    try {
      const r = await api('/api/auth/me');
      if (r && r.user){
        state.user = r.user;
        state.apiKey = r.user.apiKey || r.user.api_key || '';
        try { localStorage.setItem('ate_user', JSON.stringify(r.user)); } catch (e){}
      }
    } catch (e){}
  }

  await Promise.all([
    loadPlan().catch(function(){}),
    loadBusinesses().catch(function(){}),
    loadCountries().catch(function(){}),
    loadDirCountries().catch(function(){})
  ]);
  await loadAnalytics().catch(function(){});

  updateHeader();
  renderNav();
  renderTab();
  startIdleWatcher();
}

document.addEventListener('DOMContentLoaded', function(){
  const hb = $('hamburgerBtn'); if (hb) hb.addEventListener('click', openDrawer);
  const dc = $('drawerClose'); if (dc) dc.addEventListener('click', closeDrawer);
  const dov = $('drawerOverlay'); if (dov) dov.addEventListener('click', closeDrawer);
  const hl = $('headerLogoutBtn'); if (hl) hl.addEventListener('click', handleLogout);
  const isb = $('idleStayBtn'); if (isb) isb.addEventListener('click', function(){ touchActivity(); hideWarn(); });
  const ilb = $('idleLogoutBtn'); if (ilb) ilb.addEventListener('click', function(){ forceLogout('manual'); });
});

init().catch(function(e){
  console.error('Init failed:', e);
  content.innerHTML = '<div class="status error">Failed to load app: ' + esc(e.message) + '</div>';
});

})();
</script>
</body>
