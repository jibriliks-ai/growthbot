<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Traffic Engine</title>
  <meta name="theme-color" content="#0a0a0f" />
  <meta http-equiv="refresh" content="0;url=/app.html" />
  <style>
    body {
      background: #0a0a0f;
      color: #f4f4f5;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .brand-mark {
      width: 56px; height: 56px;
      border-radius: 15px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(139,92,246,0.35);
    }
    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .sub { font-size: 13px; color: #a1a1aa; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(139,92,246,0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var token = localStorage.getItem('ate_token');
      if (!token) {
        location.replace('/login.html?redirect=' + encodeURIComponent('/app.html'));
        return;
      }
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token },
      })
        .then(function (r) {
          if (r.ok) {
            location.replace('/app.html');
          } else {
            localStorage.removeItem('ate_token');
            localStorage.removeItem('ate_user');
            location.replace('/login.html?redirect=' + encodeURIComponent('/app.html'));
          }
        })
        .catch(function () {
          location.replace('/login.html?redirect=' + encodeURIComponent('/app.html'));
        });
    })();
  </script>
</head>
<body>
  <div>
    <div class="brand-mark">🚦</div>
    <div class="brand-name">Auto Traffic Engine</div>
    <div class="sub">Redirecting to your dashboard…</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
