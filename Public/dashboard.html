<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GrowthBot Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-2: #27272a;
      --border: #27272a;
      --border-strong: #3f3f46;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --dim: #71717a;
      --accent: #7c3aed;
      --accent-2: #4f46e5;
      --accent-light: #a78bfa;
      --success: #4ade80;
      --error: #f87171;
      --warning: #facc15;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent-light);text-decoration:none}
    a:hover{text-decoration:underline}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

    /* ─── Header ─── */
    .header{
      background:var(--surface);
      border-bottom:1px solid var(--border);
      padding:14px 24px;
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;flex-wrap:wrap;
      position:sticky;top:0;z-index:50;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
    .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
    .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .plan-badge{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2);color:var(--muted)}
    .plan-badge.premium{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}

    /* ─── Layout ─── */
    .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}

    /* ─── Tabs ─── */
    .tabs{
      display:flex;gap:4px;margin-bottom:24px;
      background:var(--surface);padding:6px;border-radius:12px;
      border:1px solid var(--border);
      overflow-x:auto;
    }
    .tabs::-webkit-scrollbar{height:0}
    .tab{
      flex:1;min-width:100px;padding:10px 14px;border-radius:8px;
      font-size:13px;font-weight:600;color:var(--muted);
      transition:all .15s ease;white-space:nowrap;
    }
    .tab:hover:not(.active){color:var(--text);background:var(--surface-2)}
    .tab.active{background:var(--accent);color:#fff}

    /* ─── Cards ─── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      padding:22px;
      margin-bottom:20px;
    }
    .card h2{
      font-size:16px;font-weight:700;
      margin-bottom:16px;color:var(--text);
      display:flex;align-items:center;gap:8px;
    }

    /* ─── Form ─── */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .grid.full{grid-template-columns:1fr}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    input,select,textarea{
      padding:10px 12px;border-radius:9px;
      border:1px solid var(--border-strong);
      background:var(--bg);color:var(--text);
      font-family:inherit;font-size:14px;outline:none;
      transition:border-color .15s ease;
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{resize:vertical;min-height:70px}
    input::placeholder{color:var(--dim)}
    select option{background:var(--surface);color:var(--text)}

    .btn{
      padding:11px 20px;border-radius:10px;
      background:var(--accent);color:#fff;
      font-weight:600;font-size:13px;
      transition:all .15s ease;
    }
    .btn:hover:not(:disabled){background:#6d28d9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.secondary{background:var(--surface-2);color:var(--text)}
    .btn.secondary:hover:not(:disabled){background:var(--border-strong)}
    .btn.small{padding:6px 12px;font-size:12px}

    /* ─── Tables ─── */
    .table{width:100%;border-collapse:collapse;font-size:13px}
    .table th{
      text-align:left;padding:10px 12px;
      font-size:11px;font-weight:700;color:var(--dim);
      text-transform:uppercase;letter-spacing:.06em;
      border-bottom:1px solid var(--border);
    }
    .table td{
      padding:12px;border-bottom:1px solid var(--border);
      color:#d4d4d8;vertical-align:top;
    }
    .table tr:last-child td{border-bottom:none}
    .table tr:hover td{background:rgba(124,58,237,.04)}

    .status-pill{
      display:inline-block;padding:3px 10px;border-radius:999px;
      font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    }
    .status-pill.new{background:rgba(124,58,237,.15);color:var(--accent-light)}
    .status-pill.delivered{background:rgba(74,222,128,.15);color:var(--success)}
    .status-pill.clicked{background:rgba(250,204,21,.15);color:var(--warning)}
    .status-pill.submitted{background:rgba(74,222,128,.15);color:var(--success)}
    .status-pill.sent{background:rgba(96,165,250,.15);color:#60a5fa}
    .status-pill.failed{background:rgba(248,113,113,.15);color:var(--error)}

    /* ─── Stat cards ─── */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
    .stat{
      background:var(--surface);border:1px solid var(--border);
      border-radius:12px;padding:18px;
    }
    .stat-label{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .stat-value{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent-light),#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
    .stat-sub{font-size:12px;color:var(--muted);margin-top:4px}

    /* ─── Empty state ─── */
    .empty{
      text-align:center;padding:40px 20px;color:var(--muted);
      font-size:14px;line-height:1.6;
    }
    .empty-icon{font-size:48px;margin-bottom:12px;opacity:.7}

    /* ─── Smart links ─── */
    .link-row{
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;background:var(--bg);
      border:1px solid var(--border);
      border-radius:8px;margin-bottom:6px;font-size:12px;
    }
    .link-platform{
      padding:2px 8px;border-radius:4px;
      font-size:10px;font-weight:700;text-transform:uppercase;
      background:var(--accent);color:#fff;flex-shrink:0;
    }
    .link-url{
      flex:1;color:var(--accent-light);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:'SF Mono',Menlo,Consolas,monospace;
      font-size:11px;
    }
    .link-clicks{
      font-size:11px;font-weight:700;color:var(--success);
      flex-shrink:0;
    }

    /* ─── Alerts ─── */
    .alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.5}
    .alert.info{background:rgba(124,58,237,.1);color:var(--accent-light);border:1px solid rgba(124,58,237,.3)}
    .alert.success{background:rgba(74,222,128,.1);color:var(--success);border:1px solid rgba(74,222,128,.3)}
    .alert.error{background:rgba(248,113,113,.1);color:var(--error);border:1px solid rgba(248,113,113,.3)}
    .alert.warning{background:rgba(250,204,21,.1);color:var(--warning);border:1px solid rgba(250,204,21,.3)}

    /* ─── API key input ─── */
    .apikey-bar{
      display:flex;gap:8px;align-items:center;
      background:var(--bg);border:1px solid var(--border-strong);
      border-radius:10px;padding:8px 12px;
    }
    .apikey-bar input{
      flex:1;background:transparent;border:none;
      padding:0;color:var(--text);font-size:13px;
    }
    .apikey-bar input:focus{outline:none}

    /* ─── Modal ─── */
    .modal-bg{
      position:fixed;inset:0;background:rgba(0,0,0,.7);
      display:flex;align-items:center;justify-content:center;
      padding:20px;z-index:100;backdrop-filter:blur(4px);
    }
    .modal{
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:24px;max-width:560px;width:100%;
      max-height:90vh;overflow-y:auto;
    }
    .modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

    /* ─── Spin ─── */
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .hidden{display:none!important}
  </style>
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="header">
  <div class="brand">
    <span class="brand-mark">✨</span>
    GrowthBot
  </div>
  <div class="header-actions">
    <div class="apikey-bar">
      <input type="text" id="apiKeyInput" placeholder="Paste your API key" />
      <button class="btn small secondary" id="apiKeySave">Save</button>
    </div>
    <span class="plan-badge" id="planBadge">Loading…</span>
  </div>
</header>

<!-- ═══ Main ═══ -->
<div class="wrap">
  <div id="globalAlert"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="business">🏢 Business</button>
    <button class="tab" data-tab="campaigns">📣 Campaigns</button>
    <button class="tab" data-tab="leads">👥 Leads</button>
    <button class="tab" data-tab="reviews">⭐ Reviews</button>
    <button class="tab" data-tab="analytics">📊 Analytics</button>
    <button class="tab" data-tab="social">🔗 Social</button>
  </div>

  <!-- Tab content panels -->
  <div id="tabBusiness" class="tab-panel"></div>
  <div id="tabCampaigns" class="tab-panel hidden"></div>
  <div id="tabLeads" class="tab-panel hidden"></div>
  <div id="tabReviews" class="tab-panel hidden"></div>
  <div id="tabAnalytics" class="tab-panel hidden"></div>
  <div id="tabSocial" class="tab-panel hidden"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
  apiKey: localStorage.getItem('gb_apikey') || '',
  plan: 'free',
  business: null,
  tab: 'business',
  loading: false,
};

const BASE = location.origin;

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString();
  } catch { return iso; }
}
function showAlert(msg, type) {
  $('globalAlert').innerHTML = `<div class="alert ${type || 'info'}">${esc(msg)}</div>`;
  setTimeout(() => { const a = $('globalAlert'); if (a) a.innerHTML = ''; }, 5000);
}

async function api(path, opts) {
  if (!state.apiKey && !path.startsWith('/health')) {
    throw new Error('Set your API key at the top first');
  }
  const options = Object.assign({ method: 'GET' }, opts || {});
  if (options.body && typeof options.body !== 'string') {
    options.body = JSON.stringify(options.body);
    options.headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  }
  options.headers = Object.assign({ 'x-api-key': state.apiKey }, options.headers || {});
  const res = await fetch(BASE + path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || data.message || 'HTTP ' + res.status);
  }
  return data;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  if (state.apiKey) $('apiKeyInput').value = state.apiKey;

  $('apiKeySave').addEventListener('click', () => {
    const v = $('apiKeyInput').value.trim();
    if (v.length < 4) { showAlert('API key looks too short', 'error'); return; }
    state.apiKey = v;
    localStorage.setItem('gb_apikey', v);
    showAlert('API key saved', 'success');
    loadAll();
  });

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      state.tab = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      const panelId = 'tab' + state.tab.charAt(0).toUpperCase() + state.tab.slice(1);
      $(panelId).classList.remove('hidden');
      renderTab();
    });
  });

  if (state.apiKey) await loadAll();
  else {
    $('planBadge').textContent = 'No API key';
    renderBusiness();
  }
}

async function loadAll() {
  try {
    const plan = await api('/api/check-plan?key=' + encodeURIComponent(state.apiKey));
    state.plan = plan.plan;
    $('planBadge').textContent = plan.plan === 'premium' ? '⭐ Premium' : 'Free plan';
    $('planBadge').classList.toggle('premium', plan.plan === 'premium');

    try {
      const biz = await api('/api/businesses/me');
      state.business = biz.business;
    } catch {
      state.business = null;
    }

    renderTab();
  } catch (e) {
    $('planBadge').textContent = 'Error';
    showAlert(e.message, 'error');
  }
}

function renderTab() {
  if (state.tab === 'business') renderBusiness();
  else if (state.tab === 'campaigns') renderCampaigns();
  else if (state.tab === 'leads') renderLeads();
  else if (state.tab === 'reviews') renderReviews();
  else if (state.tab === 'analytics') renderAnalytics();
  else if (state.tab === 'social') renderSocial();
}

// ═══════════════════════════════════════════════════════
// BUSINESS TAB
// ═══════════════════════════════════════════════════════
function renderBusiness() {
  const b = state.business || {};
  const panel = $('tabBusiness');

  panel.innerHTML = `
    <div class="card">
      <h2>🏢 Business Profile</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6">
        Your business profile powers everything: campaigns, listings, social posts, and reviews.
        Fill this in once — every other tool uses it automatically.
      </p>
      <div class="grid">
        <div class="field">
          <label>Business name *</label>
          <input id="bizName" value="${esc(b.name || '')}" placeholder="Jibriliks Livestock" />
        </div>
        <div class="field">
          <label>Category</label>
          <input id="bizCategory" value="${esc(b.category || '')}" placeholder="Livestock Farm" />
        </div>
        <div class="field">
          <label>Phone</label>
          <input id="bizPhone" value="${esc(b.phone || '')}" placeholder="08031234567" />
        </div>
        <div class="field">
          <label>WhatsApp</label>
          <input id="bizWhatsapp" value="${esc(b.whatsapp || '')}" placeholder="08031234567" />
        </div>
        <div class="field">
          <label>Email</label>
          <input id="bizEmail" type="email" value="${esc(b.email || '')}" placeholder="hello@example.com" />
        </div>
        <div class="field">
          <label>Website</label>
          <input id="bizWebsite" type="url" value="${esc(b.website || '')}" placeholder="https://example.com" />
        </div>
        <div class="field">
          <label>City</label>
          <input id="bizCity" value="${esc(b.city || '')}" placeholder="Warri" />
        </div>
        <div class="field">
          <label>State</label>
          <input id="bizState" value="${esc(b.state || '')}" placeholder="Delta" />
        </div>
      </div>
      <div class="field" style="margin-top:14px">
        <label>Address</label>
        <input id="bizAddress" value="${esc(b.address || '')}" placeholder="12 Airport Road, Effurun" />
      </div>
      <div class="field" style="margin-top:14px">
        <label>Description</label>
        <textarea id="bizDesc" placeholder="What does your business do? Keep it short and specific.">${esc(b.description || '')}</textarea>
      </div>
      <div class="field" style="margin-top:14px">
        <label>Google Review URL</label>
        <input id="bizReviewUrl" type="url" value="${esc(b.google_review_url || '')}" placeholder="https://g.page/r/xxx/review" />
        <div style="font-size:11px;color:var(--dim);margin-top:4px">
          Find it in Google Business Profile → Ask for reviews → copy link
        </div>
      </div>
      <button class="btn" id="bizSave" style="margin-top:20px">
        ${b.id ? 'Update business' : 'Create business'}
      </button>
    </div>
  `;

  $('bizSave').addEventListener('click', async function () {
    const btn = this;
    const payload = {
      name: $('bizName').value.trim(),
      category: $('bizCategory').value.trim(),
      phone: $('bizPhone').value.trim(),
      whatsapp: $('bizWhatsapp').value.trim(),
      email: $('bizEmail').value.trim(),
      website: $('bizWebsite').value.trim(),
      city: $('bizCity').value.trim(),
      state: $('bizState').value.trim(),
      address: $('bizAddress').value.trim(),
      description: $('bizDesc').value.trim(),
      googleReviewUrl: $('bizReviewUrl').value.trim(),
    };
    if (!payload.name) { showAlert('Business name is required', 'error'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Saving…';
    try {
      const res = state.business
        ? await api('/api/businesses/' + state.business.id, { method: 'PUT', body: payload })
        : await api('/api/businesses', { method: 'POST', body: payload });
      state.business = res.business;
      showAlert('Business saved! You can now create campaigns.', 'success');
      renderBusiness();
    } catch (e) {
      showAlert(e.message, 'error');
      btn.disabled = false;
      btn.textContent = state.business ? 'Update business' : 'Create business';
    }
  });
}

// ═══════════════════════════════════════════════════════
// CAMPAIGNS TAB
// ═══════════════════════════════════════════════════════
async function renderCampaigns() {
  const panel = $('tabCampaigns');
  if (!state.business) {
    panel.innerHTML = '<div class="empty"><div class="empty-icon">🏢</div>Create your business profile first (Business tab).</div>';
    return;
  }

  panel.innerHTML = `
    <div class="card">
      <h2>📣 New Campaign</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
        A campaign is one ad theme. We'll generate 6 unique smart links (one per platform) so you can track exactly where each customer came from.
      </p>
      <div class="field">
        <label>Campaign name *</label>
        <input id="campName" placeholder="Fresh Cows Available — May 2026" />
      </div>
      <div class="field" style="margin-top:14px">
        <label>Ad text</label>
        <textarea id="campText" placeholder="What are you promoting? Paste the caption you'd use on Facebook."></textarea>
      </div>
      <button class="btn" id="campCreate" style="margin-top:16px">Create campaign + generate links</button>
    </div>
    <div id="campList"></div>
  `;

  $('campCreate').addEventListener('click', async function () {
    const btn = this;
    const name = $('campName').value.trim();
    const text = $('campText').value.trim();
    if (!name) { showAlert('Campaign name required', 'error'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Creating…';
    try {
      const res = await api('/api/campaigns', {
        method: 'POST',
        body: { businessId: state.business.id, name, text },
      });
      showAlert('Campaign created with ' + res.links.length + ' smart links', 'success');
      $('campName').value = '';
      $('campText').value = '';
      renderCampaigns();
    } catch (e) {
      showAlert(e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create campaign + generate links';
    }
  });

  try {
    const res = await api('/api/businesses/' + state.business.id + '/campaigns');
    const campaigns = res.campaigns || [];
    const listEl = $('campList');
    if (campaigns.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="empty-icon">📣</div>No campaigns yet. Create your first one above.</div>';
      return;
    }
    let html = '<div class="card"><h2>Your Campaigns</h2>';
    for (const c of campaigns) {
      html += `
        <div style="padding:16px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
            <div>
              <div style="font-weight:600;margin-bottom:4px">${esc(c.name)}</div>
              <div style="font-size:12px;color:var(--muted)">Created ${fmtDate(c.created_at)}</div>
            </div>
            <button class="btn small secondary" data-load-links="${c.id}">View links</button>
          </div>
          <div id="links-${c.id}" style="margin-top:12px"></div>
        </div>
      `;
    }
    html += '</div>';
    listEl.innerHTML = html;

    listEl.querySelectorAll('[data-load-links]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const cid = btn.dataset.loadLinks;
        const target = $('links-' + cid);
        if (target.dataset.loaded === '1') { target.innerHTML = ''; target.dataset.loaded = ''; return; }
        btn.disabled = true; btn.textContent = 'Loading…';
        try {
          const r = await api('/api/campaigns/' + cid);
          target.innerHTML = (r.links || []).map((l) => `
            <div class="link-row">
              <span class="link-platform">${esc(l.platform)}</span>
              <span class="link-url" title="${esc(l.publicUrl)}">${esc(l.publicUrl)}</span>
              <span class="link-clicks">${l.clicks || 0} clicks</span>
              <button class="btn small secondary" data-copy="${esc(l.publicUrl)}">Copy</button>
            </div>
          `).join('');
          target.dataset.loaded = '1';
          target.querySelectorAll('[data-copy]').forEach((b) => {
            b.addEventListener('click', async () => {
              try { await navigator.clipboard.writeText(b.dataset.copy); showAlert('Link copied!', 'success'); }
              catch { showAlert('Copy failed', 'error'); }
            });
          });
          btn.textContent = 'Hide links';
        } catch (e) { showAlert(e.message, 'error'); btn.textContent = 'View links'; }
        btn.disabled = false;
      });
    });
  } catch (e) {
    $('campList').innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
  }
}

// ═══════════════════════════════════════════════════════
// LEADS TAB
// ═══════════════════════════════════════════════════════
async function renderLeads() {
  const panel = $('tabLeads');
  if (!state.business) {
    panel.innerHTML = '<div class="empty"><div class="empty-icon">👥</div>Create your business profile first.</div>';
    return;
  }
  panel.innerHTML = '<div class="card"><h2>👥 Leads Inbox</h2><div id="leadFilterRow" style="margin-bottom:14px"></div><div id="leadTable">Loading…</div></div>';

  const filters = [
    { key: '', label: 'All' },
    { key: 'new', label: 'New' },
    { key: 'delivered', label: 'Delivered' },
  ];
  $('leadFilterRow').innerHTML = filters.map((f, i) =>
    `<button class="btn small ${i === 0 ? '' : 'secondary'}" data-filter="${f.key}" style="margin-right:6px">${f.label}</button>`
  ).join('');

  async function loadLeads(filter) {
    const tbody = $('leadTable');
    tbody.innerHTML = 'Loading…';
    try {
      const path = '/api/businesses/' + state.business.id + '/leads' + (filter ? '?status=' + filter : '');
      const res = await api(path);
      const leads = res.leads || [];
      if (leads.length === 0) {
        tbody.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No leads yet. Share your smart links to start capturing clicks.</div>';
        return;
      }
      tbody.innerHTML = `
        <table class="table">
          <thead>
            <tr><th>Source</th><th>Name / Phone</th><th>Status</th><th>When</th><th></th></tr>
          </thead>
          <tbody>
            ${leads.map((l) => `
              <tr>
                <td><span class="status-pill new">${esc(l.source_platform)}</span></td>
                <td>
                  <div style="font-weight:600">${esc(l.name || '—')}</div>
                  <div style="font-size:12px;color:var(--muted)">${esc(l.phone || l.ip_city || 'anonymous')}</div>
                </td>
                <td><span class="status-pill ${esc(l.status)}">${esc(l.status)}</span></td>
                <td style="font-size:12px;color:var(--muted)">${fmtDate(l.created_at)}</td>
                <td>
                  ${l.status === 'new' ? `<button class="btn small secondary" data-deliver="${l.id}">Mark delivered</button>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      tbody.querySelectorAll('[data-deliver]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Saving…';
          try {
            await api('/api/leads/' + btn.dataset.deliver + '/delivered', { method: 'POST' });
            showAlert('Marked as delivered — review request will go out in 24h', 'success');
            loadLeads(filter);
          } catch (e) { showAlert(e.message, 'error'); btn.disabled = false; btn.textContent = 'Mark delivered'; }
        });
      });
    } catch (e) {
      tbody.innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
    }
  }

  $('leadFilterRow').querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('leadFilterRow').querySelectorAll('[data-filter]').forEach(b => {
        b.className = 'btn small ' + (b === btn ? '' : 'secondary');
      });
      loadLeads(btn.dataset.filter);
    });
  });

  loadLeads('');
}

async function renderReviews() {

  }
  panel.innerHTML = '<div class="card"><h2>⭐ Review Requests</h2><div id="reviewTable">Loading…</div></div>';

          <span style="font-size:12px">Mark a lead as "delivered" in the Leads tab — 24 hours later, GrowthBot will automatically ask them for a Google review.</span>
        </div>`;
      return;
    }
    $('reviewTable').innerHTML = `
      <table class="table">
        <thead><tr><th>Lead</th><th>Status</th><th>Sent</th><th>Submitted</th></tr></thead>
        <tbody>
          ${reviews.map(r => `
            <tr>
              <td>${esc(r.lead_name || '—')}<br><span style="font-size:12px;color:var(--muted)">${esc(r.lead_phone || '')}</span></td>
              <td><span class="status-pill ${esc(r.status)}">${esc(r.status)}</span></td>

              <td style="font-size:12px;color:var(--muted)">${fmtDate(r.submitted_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    $('reviewTable').innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
  }
}

// ═══════════════════════════════════════════════════════
// SOCIAL TAB
// ═══════════════════════════════════════════════════════
async function renderSocial() {
  const panel = $('tabSocial');
  panel.innerHTML = '<div class="card"><h2>🔗 Social Accounts</h2><div id="socialList">Loading…</div></div>';

  try {
    const res = await api('/api/social/accounts');
    const accounts = res.accounts || [];
    let html = '';
    if (accounts.length === 0) {
      html = '<div class="empty"><div class="empty-icon">🔗</div>No social accounts connected yet.</div>';
    } else {
      html = `
        <table class="table">
          <thead><tr><th>Platform</th><th>Account</th><th>Status</th><th>Last Posted</th><th>Error</th></tr></thead>
          <tbody>
            ${accounts.map(a => `
              <tr>
                <td><strong>${esc(a.platform)}</strong></td>
                <td>${esc(a.account_name || a.account_id)}</td>
                <td><span class="status-pill ${a.enabled ? 'delivered' : 'failed'}">${a.enabled ? 'connected' : 'disabled'}</span></td>
                <td style="font-size:12px;color:var(--muted)">${fmtDate(a.last_posted_at)}</td>
                <td style="font-size:11px;color:var(--error)">${esc(a.last_error || '—')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
    html += `
      <div style="margin-top:20px;padding:16px;background:var(--bg);border:1px dashed var(--border-strong);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6">
        <strong style="color:var(--text)">ℹ️ Setup guide</strong><br>
        Facebook and LinkedIn require app approval before posting works.
        Use <code>/api/social/connect</code> with a platform access token once your app is approved.
        See the deployment guide (FILE 16) for the full flow.
      </div>
    `;
    $('socialList').innerHTML = html;
  } catch (e) {
    $('socialList').innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
  }
}
